# Arma la app de Android para Play Store (archivo .aab) en la nube, y una APK para probarla a mano.
# - Se corre a mano desde la pestaña Actions ("Run workflow") o solo cuando cambia algo de la app.
# - Si están cargados los secretos de firma, el .aab sale firmado y listo para subir a Play Console.
#   Sin ellos, sale sin firmar (sirve para comprobar que compila).
# Secretos (Settings → Secrets and variables → Actions → Secrets):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Variables (misma pantalla → Variables):
#   ADMOB_APP_ID (ca-app-pub-…~…), ADMOB_INTERSTITIAL_ID y ADMOB_REWARDED_ID (ca-app-pub-…/…).
#   Sin ellas se usan los anuncios de prueba de Google (no generan plata).
name: Android

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "android/**"
      - "package.json"
      - "capacitor.config.json"
      - ".github/workflows/android.yml"

# Para publicar la APK de prueba como descarga directa (ver el último paso).
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Instalar dependencias
        run: npm ci

      - name: Armar la app web
        env:
          ADMOB_INTERSTITIAL_ID: ${{ vars.ADMOB_INTERSTITIAL_ID }}
          ADMOB_REWARDED_ID: ${{ vars.ADMOB_REWARDED_ID }}
        run: npm run build

      - name: Copiar la app al proyecto Android
        run: npx cap sync android

      - name: Preparar la clave de firma
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "Se va a firmar con tu clave."
          else
            echo "::warning::No hay clave de firma cargada: el .aab sale sin firmar (no se puede subir a Play)."
          fi

      - name: Armar el .aab
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          # Además del .aab, una APK para instalar a mano en el celular y probar: firmada con tu
          # clave si está cargada, si no con una clave de prueba.
          if [ -n "$ANDROID_KEYSTORE_FILE" ]; then APK=assembleRelease; else APK=assembleDebug; fi
          ./gradlew --no-daemon bundleRelease $APK

      - name: Guardar el .aab
        uses: actions/upload-artifact@v4
        with:
          name: ventaja21-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Guardar la APK (para probar en el celular)
        uses: actions/upload-artifact@v4
        with:
          name: edge21-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/*/*.apk
          retention-days: 30

      # Link fijo para bajar la APK desde el celular, sin zip:
      # https://github.com/lucaservetti/ventaja21/releases/download/apk-prueba/edge21-prueba.apk
      - name: Publicar la APK de prueba (descarga directa)
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/*/*.apk edge21-prueba.apk
          gh release delete apk-prueba --yes --cleanup-tag || true
          gh release create apk-prueba edge21-prueba.apk --prerelease --target "${{ github.sha }}" \
            --title "Edge 21 · APK de prueba" \
            --notes "Versión de prueba para instalar a mano en Android (compilación ${{ github.run_number }}). Los pagos y la cuenta de Google andan recién en la versión de Google Play."
