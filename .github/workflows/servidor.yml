# Publica el servidor de premios (servidor/) en Cloudflare cuando cambia en main.
# Hacen falta 3 secretos en GitHub (Settings → Secrets and variables → Actions):
# CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID y FIREBASE_SA. Ver servidor/README.md.
# Opcional: PADDLE_WEBHOOK_SECRET, para los pagos de Premium en la web (ver PAGOS_WEB.md).
name: Servidor

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "servidor/**"
      - "src/premios.js"
      - ".github/workflows/servidor.yml"

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ¿Están los secretos?
        id: hay
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PADDLE: ${{ secrets.PADDLE_WEBHOOK_SECRET }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "Todavía no están los secretos de Cloudflare: no se publica (ver servidor/README.md)."
            echo "ok=no" >> "$GITHUB_OUTPUT"
          else
            echo "ok=si" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$PADDLE" ]; then echo "paddle=si" >> "$GITHUB_OUTPUT"; fi

      - name: Publicar en Cloudflare
        if: steps.hay.outputs.ok == 'si'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: servidor
          wranglerVersion: "4.157.0"
          secrets: |
            FIREBASE_SA
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}

      # Pagos en la web: el secreto de Paddle se carga solo cuando existe (ver PAGOS_WEB.md).
      - name: Secreto de Paddle
        if: steps.hay.outputs.ok == 'si' && steps.hay.outputs.paddle == 'si'
        working-directory: servidor
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PADDLE_WEBHOOK_SECRET: ${{ secrets.PADDLE_WEBHOOK_SECRET }}
        run: printf '%s' "$PADDLE_WEBHOOK_SECRET" | npx --yes wrangler@4.157.0 secret put PADDLE_WEBHOOK_SECRET
