7c?"],p:["Ah","6s"],say:"Apostaste 10 y tenés A y 6: **17 blando**. El crupier muestra un 9."},{bank:90,act:"H",say:"Con 17 blando no te podés pasar pidiendo una carta, y contra un 9 un 17 casi nunca gana. Tocá **Pedir**."},{p:["Ah","6s","8d"],say:"Salió un 8. Con el As como 11 serían 25: el As pasa a valer 1 y tenés **15**. No te pasaste."},{ask:{q:"¿Y ahora tu mano es blanda o dura?",o:["Blanda","Dura"],a:1,x:"El As ya tiene que valer 1: es un 15 duro. Ahora sí te podés pasar."}},{act:"H",say:"Con 15 duro contra un 9 se sigue pidiendo. Tocá **Pedir**."},{p:["Ah","6s","8d","4h"],act:"S",say:"Un 4: **19**. Ahora sí, tocá **Plantarse**."},{d:["9d","7c"],meter:!0,say:"El crupier da vuelta un 7: tiene 16 y pide."},{d:["9d","7c","Ks"],stamp:{d:"bust",p:"win"},bank:110,say:"Una K: **26**, se pasó. Ganás 10. La carta gratis del 17 blando te llevó a 19."}]),I("¿Qué mano es?",["Duro 16","Blando 16","Blando 6"],1,"Tiene un As que vale 11: es blando 16.",{cards:["Ac","5d"]}),I("¿Y esta?",["Blando 16","Duro 16","Te pasaste"],1,"Con el 10, el As como 11 te pasaría (26), así que vale 1: duro 16.",{cards:["Ac","5d","10s"]}),I("Tenés A,4 (blando 15). Si pedís una carta, ¿te podés pasar?",["Sí, con un 10","No, con ninguna carta"],1,"Con un 10 tendrías 25 si el As valiera 11, pero pasa a valer 1: duro 15. Desde una blanda nunca te pasás con una sola carta.")]},{id:"l5",title:"Por qué gana la casa",sum:["La ventaja de la casa sale de una sola regla: si te pasás, perdés aunque el crupier también se pase.","Imitando al crupier perdés alrededor de 5,5 %; con estrategia básica, cerca de 0,5 %.","Plantarte cuando quieras, doblar, separar y cobrar 3:2 son tus armas."],steps:[Z("Vos jugás primero",["Si los dos jugaran igual, el juego sería parejo. La diferencia está en el orden: **vos jugás primero**.","Si te pasás, perdés aunque después el crupier también se pase."],{v:"outcomes",items:[{l:"Te pasás vos",r:"Perdés",tone:"bad"},{l:"Se pasa el crupier",r:"Ganás",tone:"good"},{l:"Se pasan los dos",r:"Perdés",tone:"bad"}]}),Z("Cuánto vale esa ventaja",["Un jugador que **imita al crupier** (pide hasta 17 y nunca dobla ni separa) pierde alrededor de **5,5 %** de lo que apuesta.","Con la **estrategia básica**, la ventaja de la casa baja a alrededor de **0,5 %**. Y contando cartas la podés dar vuelta."],{v:"tiles",items:[{v:"5,5 %",l:"imitando al crupier",tone:"bad"},{v:"0,5 %",l:"con estrategia básica",tone:"mid"},{v:"+1 %",l:"a tu favor contando",tone:"good"}]}),Z("Lo que vos tenés y el crupier no",["Para compensar, tenés opciones que el crupier no tiene: plantarte cuando quieras, **doblar** (*double*), **separar** (*split*) y cobrar el blackjack 3 a 2."]),Z("La estrategia básica",["La mejor jugada para cada mano ya se conoce: se llama **estrategia básica**. La calcularon en 1956 cuatro matemáticos del ejército de Estados Unidos, con calculadoras de escritorio, y las computadoras la fueron afinando."],{v:"chart",tab:"hard"}),Z("Cómo la vas a aprender",["La sección 2 te la enseña de a un tipo de mano.",'El 0,5 % solo vale si la seguís **en todas las manos**: cada jugada "por intuición" te cuesta plata.'],{v:"chart",tab:"hard"}),I("¿De dónde sale la ventaja de la casa?",["El crupier tiene mejores cartas","Si te pasás perdés, aunque el crupier también se pase","Las cartas están arregladas"],1,"Es la única asimetría del juego, y alcanza para que la casa gane a la larga."),I('¿Qué hace un jugador que "imita al crupier"?',["Pide hasta 17 y nunca dobla ni separa","Se planta siempre con 12","Dobla todas las manos"],0,"Y pierde alrededor de 5,5 %: unas diez veces más que con la estrategia básica."),I("Con estrategia básica perfecta, ¿cuánto pierde un jugador a la larga?",["Nada: el juego queda parejo","Alrededor de 0,5 % de lo que apuesta","Alrededor de 10 %"],1,"Depende de las reglas de la mesa, pero en un buen casino ronda el 0,5 %.")]}]},{id:2,title:"Cómo jugar tu mano",desc:"La jugada correcta para cada mano que te puede tocar",icon:"h",lessons:[{id:"l6",title:"Leer la carta del crupier",sum:["Cada decisión usa dos datos: tu total y la carta visible del crupier.","Con 2 a 6 visible el crupier se pasa seguido: arriesgá menos y dejalo pedir.","Con 7 a As casi siempre arma una mano: necesitás un total de verdad."],steps:[...pa([{bank:100,d:["5d","X?"],p:["Kc","3h"],hl:"both",say:"Sección 2: misma mesa, otra habilidad. Desde ahora, cada decisión usa dos datos: **tu total** y **la carta visible del crupier**. Esa carta te dice cómo suele terminar su mano."},{bust:{hl:[5,6,10]},say:"Primero los números. Si muestra un 5 o un 6, el crupier se pasa unas **42 de cada 100** veces. Si muestra un 10, unas **23**. Las mismas reglas, casi el doble de veces."},{bust:{hl:[5,10]},ask:{q:"Tu 13 necesita que el crupier se pase. ¿Qué carta visible le conviene?",o:["Un 5","Un 10"],a:0,x:"El 5. Con un 5 el crupier se pasa casi el doble de veces, así que plantarte y esperar pasa a ser una opción real."}},{bust:{groups:!0},say:"Hay dos grupos. **Del 2 al 6:** el crupier se pasa seguido, así que arriesgás menos y lo dejás pedir. **Del 7 al As:** casi siempre arma una mano, así que necesitás un total de verdad."},{reset:!0,bank:90,bet:10,d:["5d","10s?"],p:["7c","5s"],bustMini:!0,say:"Usalo ahora. Apostaste 10 y tenés **12 duro** contra un 5."},{play:{a:"S",x:"Te plantás y el riesgo lo corre el crupier: con un 5 se pasa unas 42 de cada 100 veces, y plantarte solo pierde cuando él arma una mano."},say:"12 contra un 5. ¿Pedís o te plantás?"},{d:["5d","10s","9c"],bustMini:!1,meter:!0,stamp:{d:"bust"},say:"El crupier da vuelta un 10: 15, y está obligado a pedir. Un 9: **24**, se pasó."},{stamp:{d:"bust",p:"win"},bank:110,say:"Ganaste con 12, plantándote. Te lo dijo su carta visible."},{bust:{groups:!0},say:"Repetí los dos grupos, que mandan en las próximas seis lecciones. **Del 2 al 6**, el crupier se pasa seguido: plantate más y doblá cuando puedas. **Del 7 al As**, casi siempre arma una mano: construí tu total."}]),I("¿Con qué carta visible se pasa más seguido el crupier?",["2","6","10","As"],1,"Con 5 y 6 se pasa alrededor de 42 de cada 100 veces: son sus peores cartas."),I("El crupier muestra un 7. ¿Es una carta débil o fuerte?",["Débil","Fuerte"],1,"Con un 7 y una tapada de 10 ya tiene 17 y se planta. Se pasa unas 26 de cada 100 veces.")]},{id:"l7",title:"Cómo jugar el 16",sum:["Con 16 duro, plantate contra 2 a 6 y pedí contra 7 a As.","Pedir con 16 contra una carta fuerte duele, pero pierde menos que plantarse.","Si la mesa permite rendirse, 16 contra 9, 10 o As se rinde."],steps:[...pa([{bank:90,bet:10,say:"¿Te acordás de que vos jugás primero (lección 5)? Esta es la mano donde más te cuesta: 16 contra una carta fuerte. Es la peor mano que te puede tocar. Apostás 10."},{d:["10h","9s?"],p:["10c","6s"],say:"16 contra un 10. Esta mesa no permite rendirse, así que la elección es pedir o plantarse. Ninguna es buena: perdés unas tres de cada cuatro manos de cualquier forma."},{outcomes:{plays:["S","H"]},say:"Compará las dos jugadas en 100 manos. Plantado, ganás unas 23 (cuando el crupier se pasa) y perdés 77. Pidiendo, ganás unas 20, empatás 6 y perdés 74."},{outcomes:{plays:["S","H"],net:!0},say:"Si hacés la cuenta, quedan casi iguales. La cuenta exacta deja a pedir apenas adelante, por una fracción de apuesta. Es una de las decisiones más parejas de toda la tabla."},{outcomes:{plays:["S","H"],net:!0},play:{a:"H",x:"Pedir, por poco. Una decisión pareja igual tiene una respuesta correcta, y la tomás cada vez que te toca esta mano."},say:"Muy parejo. ¿Qué jugada está adelante?"},{outcomes:null,p:["10c","6s","4d"],act:"S",say:"Pediste y salió un 4: **20**. Ahora tocá **Plantarse**."},{d:["10h","9s"],meter:!0,stamp:{p:"win"},bank:110,say:"El crupier da vuelta un 9: **19**. Esta la ganaste."},{say:"El 4 fue suerte. La decisión era correcta antes de que saliera la carta, y habría sido correcta aunque te pasaras."},{chips:[{v:10,l:"Tu apuesta"},{v:5,l:"Vuelve la mitad",tone:"acc"},{v:5,l:"Entregás la mitad",tone:"bad"}] !0,say:"Segunda ronda: la excepción. Mano nueva."},{play:{a:"S",x:"Te plantás. El 2 no es tan débil como un 4, 5 o 6, pero con 13 o más igual te plantás. Solo el 12 pide contra 2 o 3."},say:"13 contra un 2. Cuidado con esta."},{d:["2s","8s","7d"],bustMini:!1,meter:!0,stamp:{p:"lose"},say:"Da vuelta un 8: tiene 10. Pide y saca un 7: **17**. Tu 13 pierde y se van los 10."},{chart:{tab:"hard",rows:[16,15,14,13,12],hl:[13,0]},say:"La jugada igual era la correcta. Las jugadas correctas pierden seguido, y un resultado no cambia cuál es la mejor jugada."}]),...pa([{bank:100,bet:10,d:["3c","9s?"],p:["10d","2s"],say:"Apostaste 10 y tenés 12 contra un 3. Con 12 solo te pasás si sale una carta de 10."},{bank:90,dots:{n:31,label:"31 de cada 100 cartas valen 10"},say:"Eso es unas **31 de cada 100** cartas. Las otras 69 te mejoran."},{outcomes:{plays:["S","H"],net:!0},say:"Y un crupier con 3 no se pasa tanto como parece. En 100 manos, pedir pierde unas 2 apuestas menos que plantarse."},{act:"H",say:"Tocá **Pedir**."},{p:["10d","2s","7h"],act:"S",say:"Un 7: **19**. Tocá **Plantarse**."},{d:["3c","9s"],meter:!0,say:"El crupier da vuelta un 9: tiene 12 y pide."},{d:["3c","9s","5d"],stamp:{p:"win"},bank:110,say:"Sacó un 5: **17**, se planta. Tu 19 gana."}]),De("4",["10s","2d"],"S","Plantate 12 contra 4: el crupier se pasa unas 39 de cada 100 veces."),De("9",["10d","4c"],"H","Pedí 14 contra 9: con un 9 el crupier llega a 19 seguido."),De("3",["9h","3s"],"H","Pedí 12 contra 3: es la excepción de la regla.")]},{id:"l9",title:"El 18 blando",sum:["18 blando (A,7): plantate contra 2, 7 y 8.","Doblalo contra 3 a 6 (si no podés doblar, plantate).","Pedí contra 9, 10 y As: ahí 18 pierde más de lo que gana."],steps:[Z("Una mano engañosa",["A,7 suma 18 y parece buena mano. Pero se juega de **tres maneras distintas** según la carta del crupier."],{v:"chart",tab:"soft",rows:[18]}),...pa([{bank:100,bet:10,d:["5d","10s?"],p:["Ah","7c"],say:"Apostaste 10 y tenés A y 7: **18 blando** contra un 5."},{bank:90,act:"D",say:"El crupier está débil y tu mano no se pasa con una carta. Doblá: tocá **Doblar**."},{bet:20,bank:80,p:["Ah","7c","3s"],say:"Pusiste 10 más y recibís una sola carta: un 3. **21**."},{d:["5d","10s"],meter:!0,say:"El crupier da vuelta un 10: tiene 15 y pide."},{d:["5d","10s","8h"],stamp:{d:"bust",p:"win"},bank:120,say:"Un 8: **23**, se pasó. Cobrás 20 por tu apuesta doblada."}]),Z("La regla",["**Contra 2, 7 u 8: plantate.**","**Contra 3 a 6: doblá** (si no podés doblar, plantate).","**Contra 9, 10 o As: pedí.** No te podés pasar con una carta, y contra cartas fuertes 18 pierde más de lo que gana."]),De("9",["Ah","7c"],"H","Pedí: contra 9, un 18 pierde más de lo que gana y una carta no te puede pasar."),De("5",["As","7d"],"D","Doblá: el crupier con 5 está débil y tu mano no se pasa con una carta."),De("7",["Ad","7s"],"S","Plantate: tu 18 le gana al 17 que el crupier suele armar."),De("A",["Ac","7h"],"H","Pedí: contra As, 18 blando pierde."),De("2",["Ah","7s"],"S","Plantate contra 2 (en mesas S17; en mesas H17 se dobla)."),Z("Las demás blandas",["**A,8 y A,9:** plantate siempre (en mesas H17, A,8 contra 6 se dobla).","**A,2 a A,6:** pedí, salvo contra un crupier débil, donde se doblan. Lo ves en la próxima lección."])]},{id:"l10",title:"Cuándo doblar",sum:["Doblar es duplicar la apuesta a cambio de una sola carta más, con tus dos primeras cartas.","11 se dobla contra todo menos As; 10 contra 2 a 9; 9 contra 3 a 6.","Las blandas chicas se doblan contra un crupier débil, sobre todo contra 5 y 6."],steps:[Z("Doblar",["Doblar (en inglés, *double* o *double down*) es **duplicar tu apuesta** a cambio de recibir **una sola carta más**.","Se hace con tus dos primeras cartas, cuando sos favorito en la mano."]),...pa([{bank:100,bet:10,d:["6c","Qh?"],p:["6h","5d"],say:"Apostaste 10 y tenés **11** contra un 6."},{bank:90,act:"D",say:"Es la mejor mano para doblar: casi un tercio de las cartas te dejan en 21. Tocá **Doblar**."},{bet:20,bank:80,p:["6h","5d","Kd"],s  cada una: **11** y **18**. Dos manos mucho mejores que un 16."},{say:"Desde ahí, cada mano se juega por separado, como cualquier otra. Separando los 8 contra un 10 perdés menos que jugando el 16."}]),Z("Los ases: siempre",["Dos ases juntos suman un 12 flojo. Separados, cada As arranca en 11 y cualquier carta de 10 te deja en 21.","**Separá los ases siempre.** En casi todos los casinos recibís una sola carta por As, y A + 10 después de separar es 21, no blackjack."]),Z("Los ochos: siempre",["8,8 es 16, la peor mano del juego. Separados, cada 8 arranca una mano mucho mejor.","Incluso contra 10 o As: separando perdés menos que jugando el 16. Única excepción: en mesas H17 con rendición, contra As conviene rendirse."]),De("10",["8d","8s"],"P","Separá: dos manos que arrancan en 8 pierden menos que un 16."),De("6",["Ah","Ad"],"P","Separá siempre los ases."),De("A",["8c","8h"],"P","Separá (en mesas S17; con H17 y rendición, rendite)."),I("Separaste ases y en uno te salió una K. ¿Tenés blackjack?",["Sí, cobro 3 a 2","No: es 21 y se paga 1 a 1"],1,"Después de separar, A + 10 cuenta como 21 común.")]},{id:"l12",title:"Pares que nunca se separan",sum:["Nunca separes los dieces: 20 gana casi siempre.","Nunca separes los cincos: jugalos como un 10.","9,9 se separa contra 2 a 9, menos contra 7; el 4,4 solo contra 5 y 6."],steps:[...pa([{bank:100,bet:10,d:["6d","9c?"],p:["Kh","Ks"],say:"Apostaste 10 y tenés dos K contra un 6. Es tentador separar contra un crupier débil…"},{bank:90,act:"S",say:"…pero 20 ya es una mano ganadora. Nunca separes los dieces: tocá **Plantarse**."},{d:["6d","9c"],meter:!0,say:"El crupier da vuelta un 9: tiene 15 y pide."},{d:["6d","9c","Jh"],stamp:{d:"bust",p:"win"},bank:110,say:"Una J: **25**, se pasó. Tu 20 cobra."}]),Z("Nunca separes los dieces",["10,10 es 20: gana casi siempre.","Separarlos es cambiar una mano ganadora por dos manos que arrancan en 10."]),Z("Nunca separes los cincos",["5,5 es 10, una gran mano para doblar.","Jugala como un 10: doblá c  y el corte del zapato bien atrás.","**En contra:** pagar 6:5, que el crupier pida con 17 blando y no poder doblar después de separar."]),I("Apostás 10 en una mesa 6:5 y sacás blackjack. ¿Cuánto ganás?",["15","12","10"],1,"6 a 5: por cada 5 cobrás 6. Con 10, 12."),I("Hay una mesa 3:2 con mínimo 25 y una 6:5 con mínimo 10. Vas a apostar 25 por mano. ¿Cuál conviene?",["La 6:5, es más barata","La 3:2"],1,"Si vas a apostar lo mismo, la 3:2 te cuesta mucho menos a la larga."),I("¿Qué regla le suma ventaja a la casa?",["El crupier se planta con 17 blando","El crupier pide con 17 blando","Se permite rendirse"],1,"Cuando el crupier pide con 17 blando a veces mejora su mano: la casa gana alrededor de 0,2 % más.")]},{id:"l14",title:"El seguro",sum:["El seguro es una apuesta aparte a que el crupier tiene blackjack; paga 2 a 1.","Sin contar cartas pierde alrededor de 7 %: no lo tomes.","El pago parejo es lo mismo que el seguro: tampoco conviene."],steps:[Z("Qué es",["Cuando el crupier muestra un As, te ofrece un **seguro** (*insurance*): apostás la mitad de tu apuesta a que tiene blackjack.","Si lo tiene, el seguro paga **2 a 1**."],{v:"cards",cards:["Ah","X"],caption:"El crupier muestra As"}),...pa([{bank:100,bet:10,d:["Ah","7s?"],p:["10c","Qd"],say:"Apostaste 10 y tenés 20. El crupier muestra un As y te ofrece el **seguro**: apostar 5 más a que tiene blackjack."},{bank:90,ask:{q:"¿Tomás el seguro?",o:["Sí, para proteger mi 20","No"],a:1,x:"El seguro no protege tu mano: es una apuesta aparte sobre su carta tapada, y sin contar cartas pierde plata."}},{d:["Ah","7s"],meter:!0,say:"El crupier mira su carta: no tiene blackjack. Tiene **18** y se planta."},{stamp:{p:"win"},bank:110,say:"Tu 20 gana. Si hubieras tomado el seguro, además habrías perdido 5."}]),Z("Por qué pierde",["Para que el seguro no pierda plata, más de un tercio de las cartas que quedan tendrían que valer 10.","Normalmente son 4 de cada 13 (31 %). Por eso el seguro pierde alrededor de **7 %** a la larga."],{v:"til ite de pérdida?",["Antes de empezar a jugar","Cuando ya perdí bastante","No hace falta"],0,"En caliente se decide mal. Y si el juego deja de ser entretenimiento, frená y pedí ayuda.")]}]},{id:4,title:"El conteo",desc:"Contá el zapato y quedate con la ventaja",icon:"c",lessons:[{id:"l16",title:"Por qué funciona contar",sum:["Las cartas que salen no vuelven hasta la próxima mezcla.","Si quedan muchas cartas altas, la ventaja pasa a tu lado.","Contar no es memorizar cartas: es llevar un solo número."],steps:[Z("Las cartas que salen no vuelven",["En un zapato, las cartas repartidas no vuelven hasta la próxima mezcla.","Si salieron muchas cartas chicas, quedan más cartas altas. Y al revés."]),...pa([{row:["2c","5d","3h","6s","4c","5h","2d","9s"],say:"Supongamos que en las primeras manos del zapato salen estas 8 cartas: siete chicas y un 9."},{row:["2c","5d","3h","6s","4c","5h","2d","9s"],say:"Esas cartas chicas ya no están. Lo que queda en el zapato tiene **más dieces y ases** que lo normal: ahora el zapato te favorece a vos."}]),Z("Las cartas altas te ayudan",["Con muchos 10 y ases salen más blackjacks (que vos cobrás 3 a 2 y el crupier no), tus dobles salen mejor y el crupier se pasa más con 12 a 16, porque **está obligado a pedir**."]),Z("Las chicas ayudan a la casa",["Con muchas cartas chicas el crupier llega a 17 sin pasarse y tus dobles fallan.","El conteo te dice cuál de las dos situaciones tenés, sin memorizar ninguna carta."]),I("Salieron muchas cartas chicas. ¿Qué queda en el zapato?",["Más cartas altas","Más cartas chicas","Lo mismo de siempre"],0,"Si las chicas ya salieron, en proporción quedan más altas."),I("¿Por qué un zapato con muchas cartas altas te favorece?",["Porque el crupier está obligado a pedir con 12 a 16 y se pasa más","Porque el crupier juega peor","Porque las cartas altas pagan más"],0,"Y además salen más blackjacks y tus dobles mejoran."),I("¿Contar cartas es memorizar todas las cartas que salieron?",["Sí","No: es llevar un solo número que sube y baja"],1,"Con Hi-Lo llevás un solo número. Lo ves en la próxima lección.")]},{id:"l17",title:"Los valores de las cartas",sum:["Hi-Lo: del 2 al 6 valen +1; 7, 8 y 9 valen 0; dieces, figuras y ases valen −1.","Sumá el valor de cada carta que ves: ese total es el conteo corrido.","Un mazo completo suma 0."],steps:[Z("Los valores",["Cuando sale una carta baja, quedan más altas: es bueno para vos, **sumá 1**.","Cuando sale una alta, **restá 1**. Las del medio no cambian nada.","Sumá a medida que ves cada carta. Ese total es tu **conteo corrido**."],{v:"values"}),{t:"deal",title:"Miralo en acción",intro:"Estas son las cartas de una ronda. Repartilas de a una y sumá el valor de cada una.",cards:["2s","5h","Kc","6d","9s","3h"],after:["Salieron cuatro cartas bajas y una alta: el zapato que queda tiene más cartas altas de lo normal.","Tu conteo corrido es **+3**. Cuánto pesa eso depende de cuántos mazos quedan: lo ves en la lección 19."]},{t:"tags",title:"Probalo",cards:["5h","Ks","8d","2c","Ah"]},I("¿Cuánto vale un 7 en Hi-Lo?",["+1","0","−1"],1,"El 7, el 8 y el 9 son neutros."),I("¿Y un As?",["+1","0","−1"],2,"El As es carta alta: −1."),I("Un mazo completo tiene 20 cartas de +1, 12 de 0 y 20 de −1. ¿Cuánto suma?",["0","+20","−20"],0,"Las +1 y las −1 se cancelan: un mazo completo suma 0. Por eso Hi-Lo es un sistema balanceado.")]},{id:"l18",title:"El conteo corrido",sum:["El conteo corrido arranca en 0 al mezclar y sigue hasta la próxima mezcla.","Contá todas las cartas que ves: las tuyas, las de los demás y las del crupier.","Cancelá de a pares: una alta y una baja juntas suman 0."],steps:[Z("Un número que se mueve",["El conteo corrido arranca en **0** cuando mezclan.","Sumás el valor de **cada carta que ves**: las tuyas, las de los otros jugadores y las del crupier. No vuelve a 0 hasta la próxima mezcla."]),Z("El truco de las parejas",["No sumes carta por carta: buscá **parejas que se cancelan**. Una alta y una baja juntas suman 0.","Solo las que sobran mueven tu con
