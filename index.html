",tone:"good"},{l:"Se pasan los dos",r:"Perd\xE9s",tone:"bad"}]}),G("Cu\xE1nto vale esa ventaja",["Un jugador que **imita al crupier** (pide hasta 17 y nunca dobla ni separa) pierde alrededor de **5,5 %** de lo que apuesta.","Con la **estrategia b\xE1sica**, la ventaja de la casa baja a alrededor de **0,5 %**. Y contando cartas la pod\xE9s dar vuelta."],{v:"tiles",items:[{v:"5,5 %",l:"imitando al crupier",tone:"bad"},{v:"0,5 %",l:"con estrategia b\xE1sica",tone:"mid"},{v:"+1 %",l:"a tu favor contando",tone:"good"}]}),G("Lo que vos ten\xE9s y el crupier no",["Para compensar, ten\xE9s opciones que el crupier no tiene: plantarte cuando quieras, **doblar**, **separar** y cobrar el blackjack 3 a 2."]),G("La estrategia b\xE1sica",["La mejor jugada para cada mano ya se conoce: se llama **estrategia b\xE1sica**. La calcularon en 1956 cuatro matem\xE1ticos del ej\xE9rcito de Estados Unidos, con calculadoras de escritorio, y las computadoras la fueron afinando."],{v:"chart",tab:"hard"}),G("C\xF3mo la vas a aprender",["La secci\xF3n 2 te la ense\xF1a de a un tipo de mano.",'El 0,5 % solo vale si la segu\xEDs **en todas las manos**: cada jugada "por intuici\xF3n" te cuesta plata.'],{v:"chart",tab:"hard"}),I("\xBFDe d\xF3nde sale la ventaja de la casa?",["El crupier tiene mejores cartas","Si te pas\xE1s perd\xE9s, aunque el crupier tambi\xE9n se pase","Las cartas est\xE1n arregladas"],1,"Es la \xFAnica asimetr\xEDa del juego, y alcanza para que la casa gane a la larga."),I('\xBFQu\xE9 hace un jugador que "imita al crupier"?',["Pide hasta 17 y nunca dobla ni separa","Se planta siempre con 12","Dobla todas las manos"],0,"Y pierde alrededor de 5,5 %: unas diez veces m\xE1s que con la estrategia b\xE1sica."),I("Con estrategia b\xE1sica perfecta, \xBFcu\xE1nto pierde un jugador a la larga?",["Nada: el juego queda parejo","Alrededor de 0,5 % de lo que apuesta","Alrededor de 10 %"],1,"Depende de las reglas de la mesa, pero en un buen casino ronda el 0,5 %.")]}]},{id:2,title:"C\xF3mo jugar tu mano",desc:"La jugada correcta para cada mano que te puede tocar",icon:"h",lessons:[{id:"l6",title:"Leer la carta del crupier",sum:["Cada decisi\xF3n usa dos datos: tu total y la carta visible del crupier.","Con 2 a 6 visible el crupier se pasa seguido: arriesg\xE1 menos y dejalo pedir.","Con 7 a As casi siempre arma una mano: necesit\xE1s un total de verdad."],steps:[...pe([{bank:100,d:["5d","X?"],p:["Kc","3h"],hl:"both",say:"Secci\xF3n 2: misma mesa, otra habilidad. Desde ahora, cada decisi\xF3n usa dos datos: **tu total** y **la carta visible del crupier**. Esa carta te dice c\xF3mo suele terminar su mano."},{bust:{hl:[5,6,10]},say:"Primero los n\xFAmeros. Si muestra un 5 o un 6, el crupier se pasa unas **42 de cada 100** veces. Si muestra un 10, unas **23**. Las mismas reglas, casi el doble de veces."},{bust:{hl:[5,10]},ask:{q:"Tu 13 necesita que el crupier se pase. \xBFQu\xE9 carta visible le conviene?",o:["Un 5","Un 10"],a:0,x:"El 5. Con un 5 el crupier se pasa casi el doble de veces, as\xED que plantarte y esperar pasa a ser una opci\xF3n real."}},{bust:{groups:!0},say:"Hay dos grupos. **Del 2 al 6:** el crupier se pasa seguido, as\xED que arriesg\xE1s menos y lo dej\xE1s pedir. **Del 7 al As:** casi siempre arma una mano, as\xED que necesit\xE1s un total de verdad."},{reset:!0,bank:90,bet:10,d:["5d","10s?"],p:["7c","5s"],bustMini:!0,say:"Usalo ahora. Apostaste 10 y ten\xE9s **12 duro** contra un 5."},{play:{a:"S",x:"Te plant\xE1s y el riesgo lo corre el crupier: con un 5 se pasa unas 42 de cada 100 veces, y plantarte solo pierde cuando \xE9l arma una mano."},say:"12 contra un 5. \xBFPed\xEDs o te plant\xE1s?"},{d:["5d","10s","9c"],bustMini:!1,meter:!0,stamp:{d:"bust"},say:"El crupier da vuelta un 10: 15, y est\xE1 obligado a pedir. Un 9: **24**, se pas\xF3."},{stamp:{d:"bust",p:"win"},bank:110,say:"Ganaste con 12, plant\xE1ndote. Te lo dijo su carta visible."},{bust:{groups:!0},say:"Repet\xED los dos grupos, que mandan en las pr\xF3ximas seis lecciones. **Del 2 al 6**, el crupier se pasa seguido: plantate m\xE1s y dobl\xE1 cuando puedas. **Del 7 al As**, casi siempre arma una mano: constru\xED tu total."}]),I("\xBFCon qu\xE9 carta visible se pasa m\xE1s seguido el crupier?",["2","6","10","As"],1,"Con 5 y 6 se pasa alrededor de 42 de cada 100 veces: son sus peores cartas."),I("El crupier muestra un 7. \xBFEs una carta d\xE9bil o fuerte?",["D\xE9bil","Fuerte"],1,"Con un 7 y una tapada de 10 ya tiene 17 y se planta. Se pasa unas 26 de cada 100 veces.")]},{id:"l7",title:"C\xF3mo jugar el 16",sum:["Con 16 duro, plantate contra 2 a 6 y ped\xED contra 7 a As.","Pedir con 16 contra una carta fuerte duele, pero pierde menos que plantarse.","Si la mesa permite rendirse, 16 contra 9, 10 o As se rinde."],steps:[...pe([{bank:90,bet:10,say:"\xBFTe acord\xE1s de que vos jug\xE1s primero (lecci\xF3n 5)? Esta es la mano donde m\xE1s te cuesta: 16 contra una carta fuerte. Es la peor mano que te puede tocar. Apost\xE1s 10."},{d:["10h","9s?"],p:["10c","6s"],say:"16 contra un 10. Esta mesa no permite rendirse, as\xED que la elecci\xF3n es pedir o plantarse. Ninguna es buena: perd\xE9s unas tres de cada cuatro manos de cualquier forma."},{outcomes:{plays:["S","H"]},say:"Compar\xE1 las dos jugadas en 100 manos. Plantado, gan\xE1s unas 23 (cuando el crupier se pasa) y perd\xE9s 77. Pidiendo, gan\xE1s unas 20, empat\xE1s 6 y perd\xE9s 74."},{outcomes:{plays:["S","H"],net:!0},say:"Si hac\xE9s la cuenta, quedan casi iguales. La cuenta exacta deja a pedir apenas adelante, por una fracci\xF3n de apuesta. Es una de las decisiones m\xE1s parejas de toda la tabla."},{outcomes:{plays:["S","H"],net:!0},play:{a:"H",x:"Pedir, por poco. Una decisi\xF3n pareja igual tiene una respuesta correcta, y la tom\xE1s cada vez que te toca esta mano."},say:"Muy parejo. \xBFQu\xE9 jugada est\xE1 adelante?"},{outcomes:null,p:["10c","6s","4d"],act:"S",say:"Pediste y sali\xF3 un 4: **20**. Ahora toc\xE1 **Plantarse**."},{d:["10h","9s"],meter:!0,stamp:{p:"win"},bank:110,say:"El crupier da vuelta un 9: **19**. Esta la ganaste."},{say:"El 4 fue suerte. La decisi\xF3n era correcta antes de que saliera la carta, y habr\xEDa sido correcta aunque te pasaras."},{chips:[{v:10,l:"Tu apuesta"},{v:5,l:"Vuelve la mitad",tone:"acc"},{v:5,l:"Entreg\xE1s la mitad",tone:"bad"}],say:"Una cosa m\xE1s: algunas mesas te dejan **rendirte**, es decir, abandonar la mano a cambio de la mitad de tu apuesta. Donde se puede, 16 contra 9, 10 o As se rinde, y tambi\xE9n 15 contra 10."}]),G("La regla",["**Contra 2 a 6: plantate.** El crupier se pasa seguido: dej\xE1 que arriesgue \xE9l.","**Contra 7 a As: ped\xED.** Duele, pero plantarte con 16 contra una carta fuerte pierde un poco m\xE1s."],{v:"chart",tab:"hard",rows:[16]}),za("5",["9d","7c"],"S","Plantate. Con un 5 el crupier se pasa unas 42 de cada 100 veces."),za("7",["Kc","6d"],"H","Ped\xED. Con un 7 el crupier se pasa solo unas 26 de cada 100 veces."),za("A",["9s","7h"],"H","Ped\xED. El As es la mejor carta del crupier.")]},{id:"l8",title:"Duras de 12 a 16",sum:["Contra 4, 5 o 6, plantate con 12 a 16 y dej\xE1 que pida el crupier.","Contra 7 o m\xE1s, ped\xED hasta llegar a 17 o m\xE1s.","Contra 2 o 3 hay una excepci\xF3n: con 12 se pide, con 13 o m\xE1s te plant\xE1s."],steps:[...pe([{bustcards:!0,say:"El 16 tiene cuatro vecinos: 12, 13, 14 y 15. A estos cinco totales llamalos **la zona de peligro**: son muy bajos para ganar salvo que el crupier se pase, y bastante altos como para que una sola carta te pase."},{chart:{tab:"hard",rows:[16,15,14,13,12]},say:"Una sola regla cubre los cinco. **Contra 4, 5 o 6:** plantate y dej\xE1 que pida el crupier. **Contra 7 o m\xE1s:** ped\xED hasta llegar a 17 o m\xE1s. **Contra 2 o 3** hay una excepci\xF3n: con 12 se pide; con 13 o m\xE1s, te plant\xE1s."},{bank:90,bet:10,d:["6s","10d?"],p:["8d","6c"],bustMini:!0,say:"Primera ronda. Apostaste 10 y ten\xE9s **14** contra un 6."},{play:{a:"S",x:"Te plant\xE1s y el que tiene que pedir es el crupier. Con un 6 se pasa unas 42 de cada 100 veces, y pedir te arriesgaba a pasarte primero."},say:"14 contra un 6. Dec\xED la regla y toc\xE1."},{d:["6s","10d","Kc"],bustMini:!1,meter:!0,stamp:{d:"bust"},say:"Da vuelta un 10: 16, y est\xE1 obligado a pedir. Una K: **26**, se pas\xF3."},{stamp:{d:"bust",p:"win"},bank:110,say:"Cobr\xE1s tus 10."},{reset:!0,bank:100,bet:10,d:["2s","8s?"],p:["8h","5c"],bustMini:!0,say:"Segunda ronda: la excepci\xF3n. Mano nueva."},{play:{a:"S",x:"Esper\xE1s. El 2 no es tan d\xE9bil como un 4, 5 o 6, pero con 13 o m\xE1s igual te plant\xE1s. Solo el 12 pide contra 2 o 3."},say:"13 contra un 2. Cuidado con esta."},{d:["2s","8s","7d"],bustMini:!1,meter:!0,stamp:{p:"lose"},say:"Da vuelta un 8: tiene 10. Pide y saca un 7: **17**. Tu 13 pierde y se van los 10."},{chart:{tab:"hard",rows:[16,15,14,13,12],hl:[13,0]},say:"La jugada igual era la correcta. Las jugadas correctas pierden seguido, y un resultado no cambia cu\xE1l es la mejor jugada."}]),...pe([{bank:100,bet:10,d:["3c","9s?"],p:["10d","2s"],say:"Apostaste 10 y ten\xE9s 12 contra un 3. Con 12 solo te pas\xE1s si sale una carta de 10."},{bank:90,dots:{n:31,label:"31 de cada 100 cartas valen 10"},say:"Eso es unas **31 de cada 100** cartas. Las otras 69 te mejoran."},{outcomes:{plays:["S","H"],net:!0},say:"Y un crupier con 3 no se pasa tanto como parece. En 100 manos, pedir pierde unas 2 apuestas menos que plantarse."},{act:"H",say:"Toc\xE1 **Pedir**."},{p:["10d","2s","7h"],act:"S",say:"Un 7: **19**. Toc\xE1 **Plantarse**."},{d:["3c","9s"],meter:!0,say:"El crupier da vuelta un 9: tiene 12 y pide."},{d:["3c","9s","5d"],stamp:{p:"win"},bank:110,say:"Sac\xF3 un 5: **17**, se planta. Tu 19 gana."}]),za("4",["10s","2d"],"S","Plantate 12 contra 4: el crupier se pasa unas 39 de cada 100 veces."),za("9",["10d","4c"],"H","Ped\xED 14 contra 9: con un 9 el crupier llega a 19 seguido."),za("3",["9h","3s"],"H","Ped\xED 12 contra 3: es la excepci\xF3n de la regla.")]},{id:"l9",title:"El 18 blando",sum:["18 blando (A,7): plantate contra 2, 7 y 8.","Doblalo contra 3 a 6 (si no pod\xE9s doblar, plantate).","Ped\xED contra 9, 10 y As: ah\xED 18 pierde m\xE1s de lo que gana."],steps:[G("Una mano enga\xF1osa",["A,7 suma 18 y parece buena mano. Pero se juega de **tres maneras distintas** seg\xFAn la carta del crupier."],{v:"chart",tab:"soft",rows:[18]}),...pe([{bank:100,bet:10,d:["5d","10s?"],p:["Ah","7c"],say:"Apostaste 10 y ten\xE9s A y 7: **18 blando** contra un 5."},{bank:90,act:"D",say:"El crupier est\xE1 d\xE9bil y tu mano no se pasa con una carta. Dobl\xE1: toc\xE1 **Doblar**."},{bet:20,bank:80,p:["Ah","7c","3s"],say:"Pusiste 10 m\xE1s y recib\xEDs una sola carta: un 3. **21**."},{d:["5d","10s"],meter:!0,say:"El crupier da vuelta un 10: tiene 15 y pide."},{d:["5d","10s","8h"],stamp:{d:"bust",p:"win"},bank:120,say:"Un 8: **23**, se pas\xF3. Cobr\xE1s 20 por tu apuesta doblada."}]),G("La regla",["**Contra 2, 7 u 8: plantate.**","**Contra 3 a 6: dobl\xE1** (si no pod\xE9s doblar, plantate).","**Contra 9, 10 o As: ped\xED.** No te pod\xE9s pasar con una carta, y contra cartas fuertes 18 pierde m\xE1s de lo que gana."]),za("9",["Ah","7c"],"H","Ped\xED: contra 9, un 18 pierde m\xE1s de lo que gana y una carta no te puede pasar."),za("5",["As","7d"],"D","Dobl\xE1: el crupier con 5 est\xE1 d\xE9bil y tu mano no se pasa con una carta."),za("7",["Ad","7s"],"S","Plantate: tu 18 le gana al 17 probable del crupier."),za("A",["Ac","7h"],"H","Ped\xED: contra As, 18 blando pierde."),za("2",["Ah","7s"],"S","Plantate contra 2 (en mesas S17; en mesas H17 se dobla)."),G("Las dem\xE1s blandas",["**A,8 y A,9:** plantate siempre (en mesas H17, A,8 contra 6 se dobla).","**A,2 a A,6:** ped\xED, salvo contra un crupier d\xE9bil, donde se doblan. Lo ves en la pr\xF3xima lecci\xF3n."])]},{id:"l10",title:"Cu\xE1ndo doblar",sum:["Doblar es duplicar la apuesta a cambio de una sola carta m\xE1s, con tus dos primeras cartas.","11 se dobla contra todo menos As; 10 contra 2 a 9; 9 contra 3 a 6.","Las blandas chicas se doblan contra un crupier d\xE9bil, sobre todo contra 5 y 6."],steps:[G("Doblar",["Doblar es **duplicar tu apuesta** a cambio de recibir **una sola carta m\xE1s**.","Se hace con tus dos primeras cartas, cuando sos favorito en la mano."]),...pe([{bank:100,bet:10,d:["6c","Qh?"],p:["6h","5d"],say:"Apostaste 10 y ten\xE9s **11** contra un 6."},{bank:90,act:"D",say:"Es la mejor mano para doblar: casi un tercio de las cartas te dejan en 21. Toc\xE1 **Doblar**."},{bet:20,bank:80,p:["6h","5d","Kd"],say:"Una K: **21**, con el doble apostado."},{d:["6c","Qh"],meter:!0,say:"El crupier tiene 16 y pide."},{d:["6c","Qh","4s"],say:"Un 4: **20**. Se planta."},{stamp:{p:"win"},bank:120,say:"Tu 21 gana y cobr\xE1s 20: el doble que sin doblar."}]),G("Los dobles duros",["**11:** dobl\xE1 contra todo, menos contra As (en mesas H17, tambi\xE9n contra As).","**10:** dobl\xE1 contra 2 a 9.","**9:** dobl\xE1 contra 3 a 6."],{v:"chart",tab:"hard",rows:[11,10,9]}),G("Los dobles blandos",["Contra **5 y 6**: dobl\xE1 de A,2 a A,7.","Contra **4**: de A,4 a A,7.","Contra **3**: A,6 y A,7.","Contra **2**: ninguna (en mesas H17, A,7)."],{v:"chart",tab:"soft",rows:[18,17,16,15,14,13]}),za("10",["6c","4s"],"H","Ped\xED 10 contra 10: el crupier tiene una carta tan buena como la tuya."),za("2",["5h","4c"],"H","Ped\xED 9 contra 2: el 9 solo se dobla contra 3 a 6."),za("4",["Ad","4c"],"D","Dobl\xE1 A,4 contra 4."),za("4",["As","2h"],"H","Ped\xED A,2 contra 4: A,2 y A,3 se doblan solo contra 5 y 6."),za("A",["7d","4s"],"H","Ped\xED 11 contra As (en mesas S17)."),I("Pediste con 5,4 y te sali\xF3 un 2: ten\xE9s 11 con tres cartas contra un 6. \xBFPod\xE9s doblar?",["S\xED","No: solo se dobla con las dos primeras cartas"],1,"Con tres cartas ya no se puede doblar: ped\xED.")]},{id:"l11",title:"Separar ases y ochos",sum:["Separar es dividir un par en dos manos, poniendo otra apuesta igual.","Separ\xE1 siempre los ases y los ochos.","Despu\xE9s de separar, As + 10 es 21 com\xFAn, no blackjack."],steps:[G("Separar",["Con dos cartas iguales pod\xE9s **separarlas**: pon\xE9s otra apuesta igual a la primera y cada carta arranca una mano nueva."],{v:"cards",cards:["8h","8c"],caption:"Un par de 8"}),...pe([{bank:100,bet:10,d:["10s","7d?"],p:["8h","8c"],say:"Apostaste 10 y ten\xE9s un par de 8 contra un 10. Juntos son **16**, la peor mano del juego."},{bank:90,act:"P",say:"Separalos: toc\xE1 **Separar**."},{hands:[["8h"],["8c"]],bank:80,say:"Pon\xE9s otra apuesta de 10 y cada 8 arranca su propia mano."},{hands:[["8h","3d"],["8c","Kc"]],say:"Llega una carta a cada una: **11** y **18**. Dos manos mucho mejores que un 16."},{say:"Desde ah\xED, cada mano se juega por separado, como cualquier otra. Separando los 8 contra un 10 perd\xE9s menos que jugando el 16."}]),G("Los ases: siempre",["Dos ases juntos suman un 12 flojo. Separados, cada As arranca en 11 y cualquier carta de 10 te deja en 21.","**Separ\xE1 los ases siempre.** En casi todos los casinos recib\xEDs una sola carta por As, y A + 10 despu\xE9s de separar es 21, no blackjack."]),G("Los ochos: siempre",["8,8 es 16, la peor mano del juego. Separados, cada 8 arranca una mano mucho mejor.","Incluso contra 10 o As: separando perd\xE9s menos que jugando el 16. \xDAnica excepci\xF3n: en mesas H17 con rendici\xF3n, contra As conviene rendirse."]),za("10",["8d","8s"],"P","Separ\xE1: dos manos que arrancan en 8 pierden menos que un 16."),za("6",["Ah","Ad"],"P","Separ\xE1 siempre los ases."),za("A",["8c","8h"],"P","Separ\xE1 (en mesas S17; con H17 y rendici\xF3n, rendite)."),I("Separaste ases y en uno te sali\xF3 una K. \xBFTen\xE9s blackjack?",["S\xED, cobro 3 a 2","No: es 21 y se paga 1 a 1"],1,"Despu\xE9s de separar, A + 10 cuenta como 21 com\xFAn.")]},{id:"l12",title:"Pares que nunca se separan",sum:["Nunca separes los dieces: 20 gana casi siempre.","Nunca separes los cincos: jugalos como un 10.","9,9 se separa contra 2 a 9, menos contra 7; el 4,4 solo contra 5 y 6."],steps:[...pe([{bank:100,bet:10,d:["6d","9c?"],p:["Kh","Ks"],sa  (\u22121), 8 (0), J (\u22121), 3 (+1), K (\u22121), 7 (0), Q (\u22121): \u22124."},I("\xBFEl conteo corrido vuelve a 0 en cada mano?",["S\xED","No: sigue hasta que mezclan el zapato"],1,"Se lleva durante todo el zapato.")]},{id:"l19",title:"El conteo real",sum:["Conteo real = conteo corrido \xF7 mazos que quedan.","Los mazos que quedan se estiman mirando la bandeja de descarte.","En esta app se redondea hacia abajo: +2,7 cuenta como +2."],steps:[G("El mismo conteo no vale lo mismo",["Un **+6 con un mazo por repartir** es much\xEDsimo: hay 6 cartas altas de m\xE1s en solo 52 cartas.","Un **+6 con 6 mazos por repartir** casi no se nota."],{v:"tiles",items:[{v:"+6",l:"con 1 mazo: +6 por mazo",tone:"good"},{v:"+1",l:"con 6 mazos: +1 por mazo",tone:"mid"}]}),G("La cuenta",["**Conteo real = conteo corrido \xF7 mazos que quedan.**"],{v:"tc",rc:6,decks:3}),G("La bandeja de descarte",["Los mazos que quedan se estiman mirando la **bandeja de descarte**, donde van las cartas ya jugadas.","En un zapato de 6 mazos, si en la bandeja hay 3, quedan 3 por repartir."],{v:"tray",shoe:6,played:3}),G("Redonde\xE1 hacia abajo",["En esta app el conteo real se redondea **hacia abajo**: +2,7 cuenta como +2 y \u22120,5 como \u22121.","Es lo m\xE1s prudente para apostar. Y para jugar las desviaciones da lo mismo: se mira si llegaste al \xEDndice."]),I("Conteo corrido +8 y quedan 4 mazos. \xBFConteo real?",["+2","+4","+8","+1"],0,"+8 \xF7 4 = +2."),I("Conteo corrido +9 y quedan 2 mazos. \xBFConteo real?",["+3","+4","+5"],1,"9 \xF7 2 = 4,5. Redondeando hacia abajo: +4."),I("Conteo corrido \u22126 y quedan 3 mazos. \xBFConteo real?",["\u22122","+2","\u22123"],0,"\u22126 \xF7 3 = \u22122."),I("Conteo corrido +5 y quedan 5 mazos. \xBFConteo real?",["+1","+5","0"],0,"+5 \xF7 5 = +1.")]},{id:"l20",title:"Apostar seg\xFAn el conteo",sum:["Cada punto de conteo real mueve la ventaja alrededor de 0,5 %.","La escala: hasta +1, 1 unidad; +2, 2; +3, 4; +4, 6; +5 o m\xE1s, 8.","Sub\xED y baj\xE1 la apuesta
