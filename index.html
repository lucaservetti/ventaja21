blar la apuesta después de perder)?",["Le gana a la casa","No cambia la ventaja y arriesga mucho para ganar poco"],1,"Ganás seguido de a poco, pero cuando llega una racha larga perdés todo junto."),I("¿Cuándo conviene decidir tu límite de pérdida?",["Antes de empezar a jugar","Cuando ya perdí bastante","No hace falta"],0,"En caliente se decide mal. Y si el juego deja de ser entretenimiento, frená y pedí ayuda.")]}]},{id:4,title:"El conteo",desc:"Contá el zapato y quedate con la ventaja",icon:"c",lessons:[{id:"l16",title:"Por qué funciona contar",sum:["Las cartas que salen no vuelven hasta la próxima mezcla.","Si quedan muchas cartas altas, la ventaja pasa a tu lado.","Contar no es memorizar cartas: es llevar un solo número."],steps:[J("Las cartas que salen no vuelven",["En un zapato, las cartas repartidas no vuelven hasta la próxima mezcla.","Si salieron muchas cartas chicas, quedan más cartas altas. Y al revés."]),...Pe([{row:["2c","5d","3h","6s","4c","5h","2d","9s"],say:"Supongamos que en las primeras manos del zapato salen estas 8 cartas: siete chicas y un 9."},{row:["2c","5d","3h","6s","4c","5h","2d","9s"],say:"Esas cartas chicas ya no están. Lo que queda en el zapato tiene **más dieces y ases** que lo normal: ahora el zapato te favorece a vos."}]),J("Las cartas altas te ayudan",["Con muchos 10 y ases salen más blackjacks (que vos cobrás 3 a 2 y el crupier no), tus dobles salen mejor y el crupier se pasa más con 12 a 16, porque **está obligado a pedir**."]),J("Las chicas ayudan a la casa",["Con muchas cartas chicas el crupier llega a 17 sin pasarse y tus dobles fallan.","El conteo te dice cuál de las dos situaciones tenés, sin memorizar ninguna carta."]),I("Salieron muchas cartas chicas. ¿Qué queda en el zapato?",["Más cartas altas","Más cartas chicas","Lo mismo de siempre"],0,"Si las chicas ya salieron, en proporción quedan más altas."),I("¿Por qué un zapato con muchas cartas altas te favorece?",["Porque el crupier está obligado a pedir con 12 a 16 y se pasa má
