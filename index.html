 mesa permite rendirse, 16 contra 9, 10 o As se rinde."],steps:[...ma([{bank:90,bet:10,say:"¿Te acordás de que vos jugás primero (lección 5)? Esta es la mano donde más te cuesta: 16 contra una carta fuerte. Es la peor mano que te puede tocar. Apostás 10."},{d:["10h","9s?"],p:["10c","6s"],say:"16 contra un 10. Esta mesa no permite rendirse, así que la elección es pedir o plantarse. Ninguna es buena: perdés unas tres de cada cuatro manos de cualquier forma."},{outcomes:{plays:["S","H"]},say:"Compará las dos jugadas en 100 manos. Plantado, ganás unas 23 (cuando el crupier se pasa) y perdés 77. Pidiendo, ganás unas 20, empatás 6 y perdés 74."},{outcomes:{plays:["S","H"],net:!0},say:"Si hacés la cuenta, quedan casi iguales. La cuenta exacta deja a pedir apenas adelante, por una fracción de apuesta. Es una de las decisiones más parejas de toda la tabla."},{outcomes:{plays:["S","H"],net:!0},play:{a:"H",x:"Pedir, por poco. Una decisión pareja igual tiene una respuesta correcta, y la tomás cada vez que te toca esta mano."},say:"Muy parejo. ¿Qué jugada está adelante?"},{outcomes:null,p:["10c","6s","4d"],act:"S",say:"Pediste y salió un 4: **20**. Ahora tocá **Plantarse**."},{d:["10h","9s"],meter:!0,stamp:{p:"win"},bank:110,say:"El crupier da vuelta un 9: **19**. Esta la ganaste."},{say:"El 4 fue suerte. La decisión era correcta antes de que saliera la carta, y habría sido correcta aunque te pasaras."},{chips:[{v:10,l:"Tu apuesta"},{v:5,l:"Vuelve la mitad",tone:"acc"},{v:5,l:"Entregás la mitad",tone:"bad"}],say:"Una cosa más: algunas mesas te dejan **rendirte**, es decir, abandonar la mano a cambio de la mitad de tu apuesta. Donde se puede, 16 contra 9, 10 o As se rinde, y también 15 contra 10."}]),ne("La regla",["**Contra 2 a 6: plantate.** El crupier se pasa seguido: dejá que arriesgue él.","**Contra 7 a As: pedí.** Duele, pero plantarte con 16 contra una carta fuerte pierde un poco más."],{v:"chart",tab:"hard",rows:[16]}),Ge("5",["9d","7c"],"S","Plantate. Con un 5 el crupier o podés doblar, plantate).","**Contra 9, 10 o As: pedí.** No te podés pasar con una carta, y contra cartas fuertes 18 pierde más de lo que gana."]),Ge("9",["Ah","7c"],"H","Pedí: contra 9, un 18 pierde más de lo que gana y una carta no te puede pasar."),Ge("5",["As","7d"],"D","Doblá: el crupier con 5 está débil y tu mano no se pasa con una carta."),Ge("7",["Ad","7s"],"S","Plantate: tu 18 le gana al 17 que el crupier suele armar."),Ge("A",["Ac","7h"],"H","Pedí: contra As, 18 blando pierde."),Ge("2",["Ah","7s"],"S","Plantate contra 2 (en mesas S17; en mesas H17 se dobla)."),ne("Las demás blandas",["**A,8 y A,9:** plantate siempre (en mesas H17, A,8 contra 6 se dobla).","**A,2 a A,6:** pedí, salvo contra un crupier débil, donde se doblan. Lo ves en la próxima lección."])]},{id:"l10",title:"Cuándo doblar",sum:["Doblar es duplicar la apuesta a cambio de una sola carta más, con tus dos primeras cartas.","11 se dobla contra todo menos As; 10 contra 2 a 9; 9 contra 3 a 6.","Las blandas chicas se doblan contra un crupier débil, sobre todo contra 5 y 6."],steps:[ne("Doblar",["Doblar (en inglés, *double* o *double down*) es **duplicar tu apuesta** a cambio de recibir **una sola carta más**.","Se hace con tus dos primeras cartas, cuando sos favorito en la mano."]),...ma([{bank:100,bet:10,d:["6c","Qh?"],p:["6h","5d"],say:"Apostaste 10 y tenés **11** contra un 6."},{bank:90,act:"D",say:"Es la mejor mano para doblar: casi un tercio de las cartas te dejan en 21. Tocá **Doblar**."},{bet:20,bank:80,p:["6h","5d","Kd"],say:"Una K: **21**, con el doble apostado."},{d:["6c","Qh"],meter:!0,say:"El crupier tiene 16 y pide."},{d:["6c","Qh","4s"],say:"Un 4: **20**. Se planta."},{stamp:{p:"win"},bank:120,say:"Tu 21 gana y cobrás 20: el doble que sin doblar."}]),ne("Los dobles duros",["**11:** doblá contra todo, menos contra As (en mesas H17, también contra As).","**10:** doblá contra 2 a 9.","**9:** doblá contra 3 a 6."],{v:"chart",tab:"hard",rows:[11,10,9]}),ne("Los dobles blandos",["Contra **5 y 6**: doblá de A,2 a A,7.","Contra **4**: de A,4 a A,7.","Contra **3**: A,6 y A,7.","Contra **2**: ninguna (en mesas H17, A,7)."],{v:"chart",tab:"soft",rows:[18,17,16,15,14,13]}),Ge("10",["6c","4s"],"H","Pedí 10 contra 10: el crupier tiene una carta tan buena como la tuya."),Ge("2",["5h","4c"],"H","Pedí 9 contra 2: el 9 solo se dobla contra 3 a 6."),Ge("4",["Ad","4c"],"D","Doblá A,4 contra 4."),Ge("4",["As","2h"],"H","Pedí A,2 contra 4: A,2 y A,3 se doblan solo contra 5 y 6."),Ge("A",["7d","4s"],"H","Pedí 11 contra As (en mesas S17)."),re("Pediste con 5,4 y te salió un 2: tenés 11 con tres cartas contra un 6. ¿Podés doblar?",["Sí","No: solo se dobla con las dos primeras cartas"],1,"Con tres cartas ya no se puede doblar: pedí.")]},{id:"l11",title:"Separar ases y ochos",sum:["Separar es dividir un par en dos manos, poniendo otra apuesta igual.","Separá siempre los ases y los ochos.","Después de separar, As + 10 es 21 común, no blackjack."],steps:[ne("Separar",["Con dos cartas iguales podés **separarlas** (en inglés, *split*): ponés otra apuesta igual a la primera y cada carta arranca una mano nueva."],{v:"cards",cards:["8h","8c"],caption:"Un par de 8"}),...ma([{bank:100,bet:10,d:["10s","7d?"],p:["8h","8c"],say:"Apostaste 10 y tenés un par de 8 contra un 10. Juntos son **16**, la peor mano del juego."},{bank:90,act:"P",say:"Separalos: tocá **Separar**."},{hands:[["8h"],["8c"]],bank:80,say:"Ponés otra apuesta de 10 y cada 8 arranca su propia mano."},{hands:[["8h","3d"],["8c","Kc"]],say:"Llega una carta a cada una: **11** y **18**. Dos manos mucho mejores que un 16."},{say:"Desde ahí, cada mano se juega por separado, como cualquier otra. Separando los 8 contra un 10 perdés menos que jugando el 16."}]),ne("Los ases: siempre",["Dos ases juntos suman un 12 flojo. Separados, cada As arranca en 11 y cualquier carta de 10 te deja en 21.","**Separá los ases siempre.** En casi todos los casinos recibís una sola carta por As, y A + 10 después de separar es 21, no blackjack."]),ne("Los ochos: siempre",["8,8 es 16, la peor mano del juego. Separados, cada 8 arranca una mano mucho mejor.","Incluso contra 10 o As: separando perdés menos que jugando el 16. Única excepción: en mesas H17 con rendición, contra As conviene rendirse."]),Ge("10",["8d","8s"],"P","Separá: dos manos que arrancan en 8 pierden menos que un 16."),Ge("6",["Ah","Ad"],"P","Separá siempre los ases."),Ge("A",["8c","8h"],"P","Separá (en mesas S17; con H17 y rendición, rendite)."),re("Separaste ases y en uno te salió una K. ¿Tenés blackjack?",["Sí, cobro 3 a 2","No: es 21 y se paga 1 a 1"],1,"Después de separar, A + 10 cuenta como 21 común.")]},{id:"l12",title:"Pares que nunca se separan",sum:["Nunca separes los dieces: 20 gana casi siempre.","Nunca separes los cincos: jugalos como un 10.","9,9 se separa contra 2 a 9, menos contra 7; el 4,4 solo contra 5 y 6."],steps:[...ma([{bank:100,bet:10,d:["6d","9c?"],p:["Kh","Ks"],say:"Apostaste 10 y tenés dos K contra un 6. Es tentador separar contra un crupier débil…"},{bank:90,act:"S",say:"…pero 20 ya es una mano ganadora. Nunca separes los dieces: tocá **Plantarse**."},{d:["6d","9c"],meter:!0,say:"El crupier da vuelta un 9: tiene 15 y pide."},{d:["6d","9c","Jh"],stamp:{d:"bust",p:"win"},bank:110,say:"Una J: **25**, se pasó. Tu 20 cobra."}]),ne("Nunca separes los dieces",["10,10 es 20: gana casi siempre.","Separarlos es cambiar una mano ganadora por dos manos que arrancan en 10."]),ne("Nunca separes los cincos",["5,5 es 10, una gran mano para doblar.","Jugala como un 10: doblá contra 2 a 9 y pedí contra 10 y As."]),ne("El resto de los pares",["**9,9:** separá contra 2 a 9, menos contra 7 (plantate: tu 18 le gana a su 17 probable). Contra 10 y As, plantate.","**7,7:** separá contra 2 a 7. **6,6:** contra 2 a 6. **2,2 y 3,3:** contra 2 a 7. **4,4:** solo contra 5 y 6.","Si la mesa **no deja doblar después de separar**: el 6,6 se separa contra 3 a 6, el 2,2 y el 3,3 contra 4 a 7, y el 4,4 nunca."],{v:"chart",tab:"pairs"}),Ge("8",["5c","5d"],"D","Doblá: 5,5 se juega como un 10."),Ge("7",["9h","9c"],"S","Plantate: 18 le gana al 17 probable del crupier."),Ge("9",["9s","9d"],"P","Separá: contra 9 dos manos de 9 rinden más que un 18."),Ge("3",["4h","4s"],"H","Pedí: el 4,4 solo se separa contra 5 y 6."),Ge("7",["7c","7h"],"P","Separá los 7 contra 7.")]},{id:"lt",title:"La tabla completa",sum:["La tabla junta todo: tu mano en las filas, la carta del crupier en las columnas.","H pedir, S plantarse, D doblar, P separar: las letras que vas a ver en todo el mundo.","Primero fijate si tenés un par, después si es blanda; si no, es dura."],steps:[ne("Todo en una tabla",["Ya sabés jugar cada tipo de mano. La **tabla de estrategia básica** (*basic strategy*) las junta todas: en cada casilla está la jugada que más plata te deja, o la que menos te hace perder.","Las letras son las que se usan en todo el mundo: **H** pedir (*hit*), **S** plantarse (*stand*), **D** doblar (*double*) y **P** separar (*split*)."],{v:"chart",tab:"hard"}),ne("Cómo se lee",["Buscá **tu mano** en la columna de la izquierda y la **carta visible del crupier** arriba. Donde se cruzan está la jugada.","Acá: tenés **16** y el crupier muestra un **10**. La casilla marcada dice **H**: pedí."],{v:"chart",tab:"hard",rows:[17,16,15,14,13,12],hl:[16,8]}),ne("Tres tablas",["**Pares**: tus dos primeras cartas son iguales. Es lo primero que mirás, porque ahí aparece la opción de separar.","**Blandas** (*soft*): tenés un As que vale 11.","**Duras** (*hard*): todo lo demás, incluso si tenés un As que ya vale 1."]),re("Tenés A,7. ¿En qué tabla lo buscás?",["Duras","Blandas","Pares"],1,"El As vale 11, así que es un 18 blando."),re("Tenés 8,8. ¿En qué tabla lo buscás?",["Duras","Blandas","Pares"],2,"Dos cartas iguales: primero mirás la tabla de pares."),re("Tenés A, 5 y 10. ¿En qué tabla lo buscás?",["Duras","Blandas","Pares"],0,"Si el As valiera 11 te pasarías: vale 1 y tenés 16 duro.",{cards:["Ah","5c","Ts"]}),ne("Las duras, en palabras",["Así se dice la tabla de duras con las reglas de tu mesa. Leela de arriba abajo: es más fácil de lo que parece."],{v:"chartWords",tab:"hard"}),ne("Las blandas, en palabras",["Con las blandas casi nunca te plantás antes de 18, porque no te podés pasar con una carta."],{v:"chartWords",tab:"soft"}),ne("Los pares, en palabras",["Ases y ochos: siempre. Dieces y cincos: nunca. El resto depende de la carta del crupier."],{v:"chartWords",tab:"pairs"}),Ge("10",["Ts","6h"],"H","Pedí: 13 a 16 se plantan solo contra 2 a 6."),Ge("4",["Th","2c"],"S","Plantate: con 12, plantate contra 4, 5 y 6."),Ge("6",["Ah","7d"],"D","Doblá: A,7 contra 3 a 6 se dobla."),Ge("A",["8h","8s"],"P","Separá: ases y ochos, siempre."),Ge("5",["9s","2d"],"D","Doblá: 11 se dobla casi siempre."),Ge("9",["Ad","7c"],"H","Pedí: A,7 contra 9, 10 o As es una mano floja."),ne("Tu tabla, siempre a mano",["En **Aprender**, tocá el botón de la tabla (arriba a la derecha) para verla cuando quieras.","Cada casilla te dice por qué se juega así y cómo te va con esa mano en Entrenar: un punto verde si la dominás y uno rojo si te cuesta."])]}]},{id:3,title:"Plata, ventajas y trampas",desc:"Las trampas que te cuestan plata antes de que salga una carta",icon:"d",lessons:[{id:"l13",title:"Mesas 3:2 y 6:5",sum:["Fijate en el cartel: el blackjack tiene que pagar 3:2.","Una mesa 6:5 le suma a la casa alrededor de 1,4 %.","Que el crupier pida con 17 blando o no poder doblar después de separar también te cuesta."],steps:[ne("El cartelito que importa",["En la mesa vas a ver cuánto paga el blackjack: **3 a 2** o **6 a 5**.","Parece un detalle, pero es la regla que más plata te cuesta."],{v:"payout"}),...ma([{bank:100,bet:10,d:["9h","7s?"],p:["As","Kh"],stamp:{p:"bj"},say:"Apostaste 10 y te salió blackjack. En una mesa **3:2**, cobrás 15."},{bank:115,say:"Recuperás tus 10 y cobrás 15: quedás con 115."},{say:"En una mesa **6:5**, el mismo blackjack paga 12: te quedarían 112. Parece poco, pero te sale un blackjack más o menos una vez cada 21 manos, toda la noche."}]),ne("Cuánto cuesta",["Cobrar 6:5 en vez de 3:2 le suma a la casa alrededor de **1,4 %**: casi el triple de toda la ventaja que tiene contra la estrategia básica."]),ne("Otras reglas que importan",["**A tu favor:** que el crupier se plante con 17 blando, doblar después de separar, la rendición y el corte del zapato bien atrás.","**En contra:** pagar 6:5, que el crupier pida con 17 blando y no poder doblar después de separar."]),re("Apostás 10 en una mesa 6:5 y sacás blackjack. ¿Cuánto ganás?",["15","12","10"],1,"6 a 5: por cada 5 cobrás 6. Con 10, 12."),re("Hay una mesa 3:2 con mínimo 25 y una 6:5 con mínimo 10. Vas a apostar 25 por mano. ¿Cuál conviene?",["La 6:5, es más barata","La 3:2"],1,"Si vas a apostar lo mismo, la 3:2 te cuesta mucho menos a la larga."),re("¿Qué regla le suma ventaja a la casa?",["El crupier se planta con 17 blando","El crupier pide con 17 blando","Se permite rendirse"],1,"Cuando el crupier pide con 17 blando a veces mejora su mano: la casa gana alrededor de 0,2 % más.")]},{id:"l14",title:"El seguro",sum:["El seguro es una apuesta aparte a que el crupier tiene blackjack; paga 2 a 1.","Sin contar cartas pierde alrededor de 7 %: no lo tomes.","El pago parejo es lo mismo que el seguro: tampoco conviene."],steps:[ne("Qué es",["Cuando el crupier muestra un As, te ofrece un **seguro** (*insurance*): apostás la mitad de tu apuesta a que tiene blackjack.","Si lo tiene, el seguro paga **2 a 1**."],{v:"cards",cards:["Ah","X"],caption:"El crupier muestra As"}),...ma([{bank:100,bet:10,d:["Ah","7s?"],p:["10c","Qd"],say:"Apostaste 10 y tenés 20. El crupier muestra un As y te ofrece el **seguro**: apostar 5 más a que tiene blackjack."},{bank:90,ask:{q:"¿Tomás el seguro?",o:["Sí, para proteger mi 20","No"],a:1,x:"El seguro no protege tu mano: es una apuesta aparte sobre su carta tapada, y sin contar cartas pierde plata."}},{d:["Ah","7s"],meter:!0,say:"El crupier mira su carta: no tiene blackjack. Tiene **18** y se planta."},{stamp:{p:"win"},bank:110,say:"Tu 20 gana. Si hubieras tomado el seguro, además habrías perdido 5."}]),ne("Por qué pierde",["Para que el seguro no pierda plata, más de un tercio de las cartas que quedan tendrían que valer 10.","Normalmente son 4 de cada 13 (31 %). Por eso el seguro pierde alrededor de **7 %** a la larga."],{v:"tiles",items:[{v:"33 %",l:"de dieces para empatar",tone:"mid"},{v:"31 %",l:"lo que hay normalmente",tone:"bad"}]}),ne("El pago parejo",["Si tenés blackjack y el crupier muestra As, te ofrecen **pago parejo** (even money): cobrar 1 a 1 en el acto.","Es exactamente lo mismo que tomar el seguro, así que tampoco conviene."]),re("¿Cuánto paga el seguro?",["1 a 1","2 a 1","3 a 2"],1,"Paga 2 a 1 si el crupier tiene blackjack."),re("¿Cuándo sí conviene el seguro?",["Nunca","Cuando contás cartas y quedan muchos dieces","Cuando tenés blackjack"],1,"Con el conteo alto quedan suficientes dieces. Lo ves en la sección 4.")]},{id:"l15",title:"Cuándo levantarse",sum:["Las rachas no cambian tus chances: solo importa qué cartas quedan.","Decidí cuánto jugar y cuánto podés perder antes de sentarte.","Ningún sistema de apuestas, como la martingala, le gana a la casa."],steps:[ne("Las rachas no existen",['Haber perdido cinco manos seguidas no hace que "te toque ganar".',"Lo único que cambia tus chances es **qué cartas quedan en el zapato**, y eso es justamente lo que mide el conteo."]),ne("Tus límites, antes de sentarte",["Decidí cuánto vas a jugar y cuánto podés perder **antes** de llegar.","Jugá solo plata que no necesitás. Apostar más para recuperar es la forma más rápida de perder mucho."]),ne("Los sistemas de apuestas",["Duplicar la apuesta después de perder (la martingala) y otras progresiones **no cambian la ventaja**: solo cambian cuándo y cuánto perdés.","El conteo funciona porque mira las cartas, no los resultados anteriores."]),re("Perdiste cinco manos seguidas. ¿La próxima tenés más chances de ganar?",["Sí, ya me toca","No: los resultados anteriores no cambian nada"],1,"Las cartas no se acuerdan de lo que ganaste o perdiste."),re("¿Qué hace la martingala (doblar la apuesta después de perder)?",["Le gana a la casa","No cambia la ventaja y arriesga mucho para ganar poco"],1,"Ganás seguido de a poco, pero cuando llega una racha larga perdés todo junto."),re("¿Cuándo conviene decidir tu límite de pérdida?",["Antes de empezar a jugar","Cuando ya perdí bastante","No hace falta"],0,"En caliente se decide mal. Y si el juego deja de ser entretenimiento, frená y pedí ayuda.")]}]},{id:4,title:"El conteo",desc:"Contá el zapato y quedate con la ventaja",icon:"c",lessons:[{id:"l16",title:"Por qué funciona contar",sum:["Las cartas que salen no vuelven hasta la próxima mezcla.","Si quedan muchas cartas altas, la ventaja pasa a tu lado.","Contar no es memorizar cartas: es llevar un solo número."],steps:[ne("Las cartas que salen no vuelven",["En un zapato, las cartas repartidas no vuelven hasta la próxima mezcla.","Si salieron muchas cartas chicas, quedan más cartas altas. Y al revés."]),...ma([{row:["2c","5d","3h","6s","4c","5h","2d","9s"],say:"Supongamos que en las primeras manos del zapato salen estas 8 cartas: siete chicas y un 9."},{row:["2c","5d","3h","6s","4c","5h","2d","9s"],say:"Esas cartas chicas ya no están. Lo que queda en el zapato tiene **más dieces y ases** que lo normal: ahora el zapato te favorece a vos."}]),ne("Las cartas altas te ayudan",["Con muchos 10 y ases salen más blackjacks (que vos cobrás 3 a 2 y el crupier no), tus dobles salen mejor y el crupier se pasa más con 12 a 16, porque **está obligado a pedir**."]),ne("Las chicas ayudan a la casa",["Con muchas cartas chicas el crupier llega a 17 sin pasarse y tus dobles fallan.","El conteo te dice cuál de las dos situaciones tenés, sin memorizar ninguna carta."]),re("Salieron muchas cartas chicas. ¿Qué queda en el zapato?",["Más cartas altas","Más cartas chicas","Lo mismo de siempre"],0,"Si las chicas ya salieron, en proporción quedan más altas."),re("¿Por qué un zapato con muchas cartas altas te favorece?",["Porque el crupier está obligado a pedir con 12 a 16 y se pasa más","Porque el crupier juega peor","Porque las cartas altas pagan más"],0,"Y además salen más blackjacks y tus dobles mejoran."),re("¿Contar cartas es memorizar todas las cartas que salieron?",["Sí","No: es llevar un solo número que sube y baja"],1,"Con Hi-Lo llevás un solo número. Lo ves en la próxima lección.")]},{id:"l17",title:"Los valores de las cartas",sum:["Hi-Lo: del 2 al 6 valen +1; 7, 8 y 9 valen 0; dieces, figuras y ases valen −1.","Sumá el valor de cada carta que ves: ese total es el conteo corrido (running count).","Un mazo completo suma 0."],steps:[...ma([{bank:100,rc:0,left:6,say:"Volvés a la mesa, ahora para contar. El sistema **Hi-Lo** le da a cada carta un valor: **+1, 0 o −1**. Mirá qué pasa cuando salen cartas."},{bet:10,bank:90,d:["5d","Kc?"],p:["3h","6s"],tags:!0,say:"Te tocan un 3 y un 6, y el crupier muestra un 5. Las tres son **bajas (del 2 al 6)**: cada una vale **+1**."},{rc:3,tags:!0,say:"Salieron tres cartas bajas: en el zapato quedan más altas que antes, y eso te conviene. El **conteo corrido** (*running count*) sube a **+3**."},{p:["3h","6s","8c"],tags:!0,say:"Pedís y sale un 8. **El 7, el 8 y el 9 valen 0**: no cambian nada. Seguís en **+3**."},{d:["5d","Kc"],tags:!0,ask:{q:"El crupier da vuelta una K. ¿Cuánto vale?",o:["+1","0","−1"],a:2,x:"Las altas (10, J, Q, K y As) valen −1: quedan menos cartas altas en el zapato."}},{rc:2,d:["5d","Kc","9h"],stamp:{d:"bust",p:"win"},bank:110,tags:!0,say:"La K resta 1: **+2**. El crupier pide y saca un 9, neutro: tiene **24**, se pasó. Terminás la ronda con conteo **+2**."}]),ne("Los valores",["Cuando sale una carta baja, quedan más altas: es bueno para vos, **sumá 1**.","Cuando sale una alta, **restá 1**. Las del medio no cambian nada.","Sumá a medida que ves cada carta. Ese total es tu **conteo corrido** (*running count*)."],{v:"values"}),{t:"deal",title:"Miralo en acción",intro:"Estas son las cartas de una ronda. Repartilas de a una y sumá el valor de cada una.",cards:["2s","5h","Kc","6d","9s","3h"],after:["Salieron cuatro cartas bajas y una alta: el zapato que queda tiene más cartas altas de lo normal.","Tu conteo corrido es **+3**. Cuánto pesa eso depende de cuántos mazos quedan: lo ves en la lección 19."]},{t:"tags",title:"Probalo",cards:["5h","Ks","8d","2c","Ah"]},re("¿Cuánto vale un 7 en Hi-Lo?",["+1","0","−1"],1,"El 7, el 8 y el 9 son neutros."),re("¿Cuánto vale un As en Hi-Lo?",["+1","0","−1"],2,"El As es carta alta: −1."),re("Un mazo completo tiene 20 cartas de +1, 12 de 0 y 20 de −1. ¿Cuánto suma?",["0","+20","−20"],0,"Las +1 y las −1 se cancelan: un mazo completo suma 0. Por eso Hi-Lo es un sistema balanceado.")]},{id:"l18",title:"El conteo corrido",sum:["El conteo corrido arranca en 0 al mezclar y sigue hasta la próxima mezcla.","Contá todas las cartas que ves: las tuyas, las de los demás y las del crupier.","Cancelá de a pares: una alta y una baja juntas suman 0."],steps:[...ma([{bank:100,rc:0,left:6,others:[{name:"Ana",cards:[]}],say:"El conteo corrido arranca en **0** cuando mezclan y sigue mano tras mano hasta la próxima mezcla. Contás **todas** las cartas que ves, también las de los demás."},{bet:10,bank:90,others:[{name:"Ana",cards:["Kh","4c"]}],d:["5h","10c?"],p:["9s","Qd"],tags:!0,say:"Primera ronda: Ana tiene K y 4, vos 9 y Q, y el crupier muestra un 5."},{tags:!0,ask:{q:"¿Cuánto da el conteo hasta acá?",o:["−1","0","+1"],a:1,x:"La K se cancela con el 4, tu Q con el 5 del crupier y el 9 es neutro: 0."}},{tags:!0,say:"Ese es el truco: **cancelar de a pares**. Una alta y una baja juntas suman 0, así que no sumás carta por carta: solo mueven el conteo las que sobran."},{d:["5h","10c"],rc:-1,tags:!0,say:"Ana y vos se plantan. El crupier da vuelta un 10: **−1**."},{d:["5h","10c","7s"],stamp:{d:"bust",p:"win"},bank:110,tags:!0,say:"Pide y saca un 7: **22**, se pasó. El 7 es neutro: el conteo queda en **−1**, y así sigue en la próxima mano."},{reset:!
