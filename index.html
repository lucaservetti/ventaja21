to?",["Para adivinar su carta tapada","Porque se puede calcular qué tan seguido se pasa según la carta que muestra","No sirve para nada"],1,"Como el crupier juega siempre igual, se sabe qué tan seguido se pasa con cada carta visible. Toda la estrategia básica sale de ahí.")]},{id:"l4",title:"Manos blandas",sum:["Una mano es blanda (soft) cuando tiene un As que vale 11, como A,6.","Desde una blanda no te pasás con una carta: si te pasarías, el As vale 1.","Cuando el As tiene que valer 1, la mano pasa a ser dura (hard)."],steps:[se("Duras y blandas",["Una mano es **blanda** (en inglés, *soft*) si tiene un As que vale 11.","Es **dura** (*hard*) si no tiene As, o si el As tiene que valer 1 para no pasarte."],{v:"hands2",a:{cards:["Ah","6s"],label:"Blando 17"},b:{cards:["10d","7c"],label:"Duro 17"}}),...da([{bank:100,bet:10,d:["9d","7c?"],p:["Ah","6s"],say:"Apostaste 10 y tenés A y 6: **17 blando**. El crupier muestra un 9."},{bank:90,act:"H",say:"Con 17 blando no te podés pasar pidiendo una carta, y contra un 9 un 17 casi nunca gana. Tocá **Pedir**."},{p:["Ah","6s","8d"],say:"Salió un 8. Con el As como 11 serían 25: el As pasa a valer 1 y tenés **15**. No te pasaste."},{ask:{q:"Con A, 6 y 8, ¿tu mano es blanda o dura?",o:["Blanda","Dura"],a:1,x:"El As ya tiene que valer 1: es un 15 duro. Ahora sí te podés pasar."}},{act:"H",say:"Con 15 duro contra un 9 se sigue pidiendo. Tocá **Pedir**."},{p:["Ah","6s","8d","4h"],act:"S",say:"Un 4: **19**. Ahora sí, tocá **Plantarse**."},{d:["9d","7c"],meter:!0,say:"El crupier da vuelta un 7: tiene 16 y pide."},{d:["9d","7c","Ks"],stamp:{d:"bust",p:"win"},bank:110,say:"Una K: **26**, se pasó. Ganás 10. La carta gratis del 17 blando te llevó a 19."}]),ie("¿Qué mano es?",["Duro 16","Blando 16","Blando 6"],1,"Tiene un As que vale 11: es blando 16.",{cards:["Ac","5d"]}),ie("¿Qué mano es A, 5 y 10?",["Blando 16","Duro 16","Te pasaste"],1,"Con el 10, el As como 11 te pasaría (26), así que vale 1: duro 16.",{cards:["Ac","5d","10s"]}),ie("Tenés n total de verdad."},{reset:!0,bank:90,bet:10,d:["5d","10s?"],p:["7c","5s"],bustMini:!0,say:"Usalo ahora. Apostaste 10 y tenés **12 duro** contra un 5."},{play:{a:"S",x:"Te plantás y el riesgo lo corre el crupier: con un 5 se pasa unas 42 de cada 100 veces, y plantarte solo pierde cuando él arma una mano."},say:"12 contra un 5. ¿Pedís o te plantás?"},{d:["5d","10s","9c"],bustMini:!1,meter:!0,stamp:{d:"bust"},say:"El crupier da vuelta un 10: 15, y está obligado a pedir. Un 9: **24**, se pasó."},{stamp:{d:"bust",p:"win"},bank:110,say:"Ganaste con 12, plantándote. Te lo dijo su carta visible."},{bust:{groups:!0},say:"Repetí los dos grupos, que mandan en las próximas seis lecciones. **Del 2 al 6**, el crupier se pasa seguido: plantate más y doblá cuando puedas. **Del 7 al As**, casi siempre arma una mano: construí tu total."}]),ie("¿Con qué carta visible se pasa más seguido el crupier?",["2","6","10","As"],1,"Con 5 y 6 se pasa alrededor de 42 de cada 100 veces: son sus peores cartas."),ie("El crupier muestra un 7. ¿Es una carta débil o fuerte?",["Débil","Fuerte"],1,"Con un 7 y una tapada de 10 ya tiene 17 y se planta. Se pasa unas 26 de cada 100 veces.")]},{id:"l7",title:"Cómo jugar el 16",sum:["Con 16 duro, plantate contra 2 a 6 y pedí contra 7 a As.","Pedir con 16 contra una carta fuerte duele, pero pierde menos que plantarse.","Si la mesa permite rendirse, 16 contra 9, 10 o As se rinde."],steps:[...da([{bank:90,bet:10,say:"¿Te acordás de que vos jugás primero (lección 5)? Esta es la mano donde más te cuesta: 16 contra una carta fuerte. Es la peor mano que te puede tocar. Apostás 10."},{d:["10h","9s?"],p:["10c","6s"],say:"16 contra un 10. Esta mesa no permite rendirse, así que la elección es pedir o plantarse. Ninguna es buena: perdés unas tres de cada cuatro manos de cualquier forma."},{outcomes:{plays:["S","H"]},say:"Compará las dos jugadas en 100 manos. Plantado, ganás unas 23 (cuando el crupier se pasa) y perdés 77. Pidiendo, ganás unas 20, empatás 6 y perdés 74."  que una sola carta te pase."},{chart:{tab:"hard",rows:[16,15,14,13,12]},say:"Una sola regla cubre los cinco. **Contra 4, 5 o 6:** plantate y dejá que pida el crupier. **Contra 7 o más:** pedí hasta llegar a 17 o más. **Contra 2 o 3** hay una excepción: con 12 se pide; con 13 o más, te plantás."},{bank:90,bet:10,d:["6s","10d?"],p:["8d","6c"],bustMini:!0,say:"Primera ronda. Apostaste 10 y tenés **14** contra un 6."},{play:{a:"S",x:"Te plantás y el que tiene que pedir es el crupier. Con un 6 se pasa unas 42 de cada 100 veces, y pedir te arriesgaba a pasarte primero."},say:"14 contra un 6. Decí la regla y tocá."},{d:["6s","10d","Kc"],bustMini:!1,meter:!0,stamp:{d:"bust"},say:"Da vuelta un 10: 16, y está obligado a pedir. Una K: **26**, se pasó."},{stamp:{d:"bust",p:"win"},bank:110,say:"Cobrás tus 10."},{reset:!0,bank:100,bet:10,d:["2s","8s?"],p:["8h","5c"],bustMini:!0,say:"Segunda ronda: la excepción. Mano nueva."},{play:{a:"S",x:"Te plantás. El 2 no es tan débil como un 4, 5 o 6, pero con 13 o más igual te plantás. Solo el 12 pide contra 2 o 3."},say:"13 contra un 2. Cuidado con esta."},{d:["2s","8s","7d"],bustMini:!1,meter:!0,stamp:{p:"lose"},say:"Da vuelta un 8: tiene 10. Pide y saca un 7: **17**. Tu 13 pierde y se van los 10."},{chart:{tab:"hard",rows:[16,15,14,13,12],hl:[13,0]},say:"La jugada igual era la correcta. Las jugadas correctas pierden seguido, y un resultado no cambia cuál es la mejor jugada."}]),...da([{bank:100,bet:10,d:["3c","9s?"],p:["10d","2s"],say:"Apostaste 10 y tenés 12 contra un 3. Con 12 solo te pasás si sale una carta de 10."},{bank:90,dots:{n:31,label:"31 de cada 100 cartas valen 10"},say:"Eso es unas **31 de cada 100** cartas. Las otras 69 te mejoran."},{outcomes:{plays:["S","H"],net:!0},say:"Y un crupier con 3 no se pasa tanto como parece. En 100 manos, pedir pierde unas 2 apuestas menos que plantarse."},{act:"H",say:"Tocá **Pedir**."},{p:["10d","2s","7h"],act:"S",say:"Un 7: **19**. Tocá **Plantarse**."},{d:["3c","9s"],meter:!0,say:"El crupier da vuelta un 9: tiene 12 y pide."},{d:["3c","9s","5d"],stamp:{p:"win"},bank:110,say:"Sacó un 5: **17**, se planta. Tu 19 gana."}]),Qe("4",["10s","2d"],"S","Plantate 12 contra 4: el crupier se pasa unas 39 de cada 100 veces."),Qe("9",["10d","4c"],"H","Pedí 14 contra 9: con un 9 el crupier llega a 19 seguido."),Qe("3",["9h","3s"],"H","Pedí 12 contra 3: es la excepción de la regla.")]},{id:"l9",title:"El 18 blando",sum:["18 blando (A,7): plantate contra 2, 7 y 8.","Doblalo contra 3 a 6 (si no podés doblar, plantate).","Pedí contra 9, 10 y As: ahí 18 pierde más de lo que gana."],steps:[se("Una mano engañosa",["A,7 suma 18 y parece buena mano. Pero se juega de **tres maneras distintas** según la carta del crupier."],{v:"chart",tab:"soft",rows:[18]}),...da([{bank:100,bet:10,d:["5d","10s?"],p:["Ah","7c"],say:"Apostaste 10 y tenés A y 7: **18 blando** contra un 5."},{bank:90,act:"D",say:"El crupier está débil y tu mano no se pasa con una carta. Doblá: tocá **Doblar**."},{bet:20,bank:80,p:["Ah","7c","3s"],say:"Pusiste 10 más y recibís una sola carta: un 3. **21**."},{d:["5d","10s"],meter:!0,say:"El crupier da vuelta un 10: tiene 15 y pide."},{d:["5d","10s","8h"],stamp:{d:"bust",p:"win"},bank:120,say:"Un 8: **23**, se pasó. Cobrás 20 por tu apuesta doblada."}]),se("La regla",["**Contra 2, 7 u 8: plantate.**","**Contra 3 a 6: doblá** (si no podés doblar, plantate).","**Contra 9, 10 o As: pedí.** No te podés pasar con una carta, y contra cartas fuertes 18 pierde más de lo que gana."]),Qe("9",["Ah","7c"],"H","Pedí: contra 9, un 18 pierde más de lo que gana y una carta no te puede pasar."),Qe("5",["As","7d"],"D","Doblá: el crupier con 5 está débil y tu mano no se pasa con una carta."),Qe("7",["Ad","7s"],"S","Plantate: tu 18 le gana al 17 que el crupier suele armar."),Qe("A",["Ac","7h"],"H","Pedí: contra As, 18 blando pierde."),Qe("2",["Ah","7s"],"S","Plantate contra 2 (en mesas S17; en mesas H17 se dobla)."),se("Las demás blandas",["**A,8 y A,9:** plantate siempre (en mesas H : solo se dobla con las dos primeras cartas"],1,"Con tres cartas ya no se puede doblar: pedí.")]},{id:"l11",title:"Separar ases y ochos",sum:["Separar es dividir un par en dos manos, poniendo otra apuesta igual.","Separá siempre los ases y los ochos.","Después de separar, As + 10 es 21 común, no blackjack."],steps:[se("Separar",["Con dos cartas iguales podés **separarlas** (en inglés, *split*): ponés otra apuesta igual a la primera y cada carta arranca una mano nueva."],{v:"cards",cards:["8h","8c"],caption:"Un par de 8"}),...da([{bank:100,bet:10,d:["10s","7d?"],p:["8h","8c"],say:"Apostaste 10 y tenés un par de 8 contra un 10. Juntos son **16**, la peor mano del juego."},{bank:90,act:"P",say:"Separalos: tocá **Separar**."},{hands:[["8h"],["8c"]],bank:80,say:"Ponés otra apuesta de 10 y cada 8 arranca su propia mano."},{hands:[["8h","3d"],["8c","Kc"]],say:"Llega una carta a cada una: **11** y **18**. Dos manos mucho mejores que un 16."},{say:"Desde ahí, cada mano se juega por separado, como cualquier otra. Separando los 8 contra un 10 perdés menos que jugando el 16."}]),se("Los ases: siempre",["Dos ases juntos suman un 12 flojo. Separados, cada As arranca en 11 y cualquier carta de 10 te deja en 21.","**Separá los ases siempre.** En casi todos los casinos recibís una sola carta por As, y A + 10 después de separar es 21, no blackjack."]),se("Los ochos: siempre",["8,8 es 16, la peor mano del juego. Separados, cada 8 arranca una mano mucho mejor.","Incluso contra 10 o As: separando perdés menos que jugando el 16. Única excepción: en mesas H17 con rendición, contra As conviene rendirse."]),Qe("10",["8d","8s"],"P","Separá: dos manos que arrancan en 8 pierden menos que un 16."),Qe("6",["Ah","Ad"],"P","Separá siempre los ases."),Qe("A",["8c","8h"],"P","Separá (en mesas S17; con H17 y rendición, rendite)."),ie("Separaste ases y en uno te salió una K. ¿Tenés blackjack?",["Sí, cobro 3 a 2","No: es 21 y se paga 1 a 1"],1,"Después de separar, A + 10 cuenta como 21 común.")]},{id:"l12",title:"Pares que nunca se separan",sum:["Nunca separes los dieces: 20 gana casi siempre.","Nunca separes los cincos: jugalos como un 10.","9,9 se separa contra 2 a 9, menos contra 7; el 4,4 solo contra 5 y 6."],steps:[...da([{bank:100,bet:10,d:["6d","9c?"],p:["Kh","Ks"],say:"Apostaste 10 y tenés dos K contra un 6. Es tentador separar contra un crupier débil…"},{bank:90,act:"S",say:"…pero 20 ya es una mano ganadora. Nunca separes los dieces: tocá **Plantarse**."},{d:["6d","9c"],meter:!0,say:"El crupier da vuelta un 9: tiene 15 y pide."},{d:["6d","9c","Jh"],stamp:{d:"bust",p:"win"},bank:110,say:"Una J: **25**, se pasó. Tu 20 cobra."}]),se("Nunca separes los dieces",["10,10 es 20: gana casi siempre.","Separarlos es cambiar una mano ganadora por dos manos que arrancan en 10."]),se("Nunca separes los cincos",["5,5 es 10, una gran mano para doblar.","Jugala como un 10: doblá contra 2 a 9 y pedí contra 10 y As."]),se("El resto de los pares",["**9,9:** separá contra 2 a 9, menos contra 7 (plantate: tu 18 le gana a su 17 probable). Contra 10 y As, plantate.","**7,7:** separá contra 2 a 7. **6,6:** contra 2 a 6. **2,2 y 3,3:** contra 2 a 7. **4,4:** solo contra 5 y 6.","Si la mesa **no deja doblar después de separar**: el 6,6 se separa contra 3 a 6, el 2,2 y el 3,3 contra 4 a 7, y el 4,4 nunca."],{v:"chart",tab:"pairs"}),Qe("8",["5c","5d"],"D","Doblá: 5,5 se juega como un 10."),Qe("7",["9h","9c"],"S","Plantate: 18 le gana al 17 probable del crupier."),Qe("9",["9s","9d"],"P","Separá: contra 9 dos manos de 9 rinden más que un 18."),Qe("3",["4h","4s"],"H","Pedí: el 4,4 solo se separa contra 5 y 6."),Qe("7",["7c","7h"],"P","Separá los 7 contra 7.")]},{id:"lt",title:"La tabla completa",sum:["La tabla junta todo: tu mano en las filas, la carta del crupier en las columnas.","H pedir, S plantarse, D doblar, P separar: las letras que vas a ver en todo el mundo.","Primero fijate si tenés un par, después si es blanda; si no, es dura."],steps:[se("Todo en una tabla",["Ya sabés jugar cada tipo de mano. La **tabla de estrategia básica** (*basic strategy*) las junta todas: en cada casilla está la jugada que más plata te deja, o la que menos te hace perder.","Las letras son las que se usan en todo el mundo: **H** pedir (*hit*), **S** plantarse (*stand*), **D** doblar (*double*) y **P** separar (*split*)."],{v:"chart",tab:"hard"}),se("Cómo se lee",["Buscá **tu mano** en la columna de la izquierda y la **carta visible del crupier** arriba. Donde se cruzan está la jugada.","Acá: tenés **16** y el crupier muestra un **10**. La casilla marcada dice **H**: pedí."],{v:"chart",tab:"hard",rows:[17,16,15,14,13,12],hl:[16,8]}),se("Tres tablas",["**Pares**: tus dos primeras cartas son iguales. Es lo primero que mirás, porque ahí aparece la opción de separar.","**Blandas** (*soft*): tenés un As que vale 11.","**Duras** (*hard*): todo lo demás, incluso si tenés un As que ya vale 1."]),ie("Tenés A,7. ¿En qué tabla lo buscás?",["Duras","Blandas","Pares"],1,"El As vale 11, así que es un 18 blando."),ie("Tenés 8,8. ¿En qué tabla lo buscás?",["Duras","Blandas","Pares"],2,"Dos cartas iguales: primero mirás la tabla de pares."),ie("Tenés A, 5 y 10. ¿En qué tabla lo buscás?",["Duras","Blandas","Pares"],0,"Si el As valiera 11 te pasarías: vale 1 y tenés 16 duro.",{cards:["Ah","5c","Ts"]}),se("Las duras, en palabras",["Así se dice la tabla de duras con las reglas de tu mesa. Leela de arriba abajo: es más fácil de lo que parece."],{v:"chartWords",tab:"hard"}),se("Las blandas, en palabras",["Con las blandas casi nunca te plantás antes de 18, porque no te podés pasar con una carta."],{v:"chartWords",tab:"soft"}),se("Los pares, en palabras",["Ases y ochos: siempre. Dieces y cincos: nunca. El resto depende de la carta del crupier."],{v:"chartWords",tab:"pairs"}),Qe("10",["Ts","6h"],"H","Pedí: 13 a 16 se plantan solo contra 2 a 6."),Qe("4",["Th","2c"],"S","Plantate: con 12, plantate contra 4, 5 y 6."),Qe("6",["Ah","7d"],"D","Doblá: A,7 contra 3 a 6 se dobla."),Qe("A",["8h","8s"],"P","Separá: ases y ochos, siempre."),Qe("5",["9s","2d"],"D","Doblá: 11 se dobla casi siempre."),Qe("9",["Ad","7c"],"H","Pedí: A,7 contra 9, 10 o As es una mano floja."),se("Tu tabla, siempre a mano",["En **Aprender**, tocá el botón de la tabla (arriba a la derecha) para verla cuando quieras.","Cada casilla te dice por qué se juega así y cómo te va con esa mano en Entrenar: un punto verde si la dominás y uno rojo si te cuesta."])]}]},{id:3,title:"Plata, ventajas y trampas",desc:"Las trampas que te cuestan plata antes de que salga una carta",icon:"d",lessons:[{id:"l13",title:"Mesas 3:2 y 6:5",sum:["Fijate en el cartel: el blackjack tiene que pagar 3:2.","Una mesa 6:5 le suma a la casa alrededor de 1,4 %.","Que el crupier pida con 17 blando o no poder doblar después de separar también te cuesta."],steps:[se("El cartelito que importa",["En la mesa vas a ver cuánto paga el blackjack: **3 a 2** o **6 a 5**.","Parece un detalle, pero es la regla que más plata te cuesta."],{v:"payout"}),...da([{bank:100,bet:10,d:["9h","7s?"],p:["As","Kh"],stamp:{p:"bj"},say:"Apostaste 10 y te salió blackjack. En una mesa **3:2**, cobrás 15."},{bank:115,say:"Recuperás tus 10 y cobrás 15: quedás con 115."},{say:"En una mesa **6:5**, el mismo blackjack paga 12: te quedarían 112. Parece poco, pero te sale un blackjack más o menos una vez cada 21 manos, toda la noche."}]),se("Cuánto cuesta",["Cobrar 6:5 en vez de 3:2 le suma a la casa alrededor de **1,4 %**: casi el triple de toda la ventaja que tiene contra la estrategia básica."]),se("Otras reglas que importan",["**A tu favor:** que el crupier se plante con 17 blando, doblar después de separar, la rendición y el corte del zapato bien atrás.","**En contra:** pagar 6:5, que el crupier pida con 17 blando y no poder doblar después de separar."]),ie("Apostás 10 en una mesa 6:5 y sacás blackjack. ¿Cuánto ganás?",["15","12","10"],1,"6 a 5: por cada 5 cobrás 6. Con 10, 12."),ie("Hay una mesa 3:2 con mínimo 25 y una 6:5 con mínimo 10. Vas a apostar ga el seguro?",["1 a 1","2 a 1","3 a 2"],1,"Paga 2 a 1 si el crupier tiene blackjack."),ie("¿Cuándo sí conviene el seguro?",["Nunca","Cuando contás cartas y quedan muchos dieces","Cuando tenés blackjack"],1,"Con el conteo alto quedan suficientes dieces. Lo ves en la sección 4.")]},{id:"l15",title:"Cuándo levantarse",sum:["Las rachas no cambian tus chances: solo importa qué cartas quedan.","Decidí cuánto jugar y cuánto podés perder antes de sentarte.","Ningún sistema de apuestas, como la martingala, le gana a la casa."],steps:[se("Las rachas no existen",['Haber perdido cinco manos seguidas no hace que "te toque ganar".',"Lo único que cambia tus chances es **qué cartas quedan en el zapato**, y eso es justamente lo que mide el conteo."]),se("Tus límites, antes de sentarte",["Decidí cuánto vas a jugar y cuánto podés perder **antes** de llegar.","Jugá solo plata que no necesitás. Apostar más para recuperar es la forma más rápida de perder mucho."]),se("Los sistemas de apuestas",["Duplicar la apuesta después de perder (la martingala) y otras progresiones **no cambian la ventaja**: solo cambian cuándo y cuánto perdés.","El conteo funciona porque mira las cartas, no los resultados anteriores."]),ie("Perdiste cinco manos seguidas. ¿La próxima tenés más chances de ganar?",["Sí, ya me toca","No: los resultados anteriores no cambian nada"],1,"Las cartas no se acuerdan de lo que ganaste o perdiste."),ie("¿Qué hace la martingala (doblar la apuesta después de perder)?",["Le gana a la casa","No cambia la ventaja y arriesga mucho para ganar poco"],1,"Ganás seguido de a poco, pero cuando llega una racha larga perdés todo junto."),ie("¿Cuándo conviene decidir tu límite de pérdida?",["Antes de empezar a jugar","Cuando ya perdí bastante","No hace falta"],0,"En caliente se decide mal. Y si el juego deja de ser entretenimiento, frená y pedí ayuda.")]}]},{id:4,title:"El conteo",desc:"Contá el zapato y quedate con la ventaja",icon:"c",lessons:[{id:"l16",title:"Por qué funciona contar",sum:["Las cartas que salen no vuelven hasta la próxima mezcla.","Si quedan muchas cartas altas, la ventaja pasa a tu lado.","Contar no es memorizar cartas: es llevar un solo número."],steps:[se("Las cartas que salen no vuelven",["En un zapato, las cartas repartidas no vuelven hasta la próxima mezcla.","Si salieron muchas cartas chicas, quedan más cartas altas. Y al revés."]),...da([{row:["2c","5d","3h","6s","4c","5h","2d","9s"],say:"Supongamos que en las primeras manos del zapato salen estas 8 cartas: siete chicas y un 9."},{row:["2c","5d","3h","6s","4c","5h","2d","9s"],say:"Esas cartas chicas ya no están. Lo que queda en el zapato tiene **más dieces y ases** que lo normal: ahora el zapato te favorece a vos."}]),se("Las cartas altas te ayudan",["Con muchos 10 y ases salen más blackjacks (que vos cobrás 3 a 2 y el crupier no), tus dobles salen mejor y el crupier se pasa más con 12 a 16, porque **está obligado a pedir**."]),se("Las chicas ayudan a la casa",["Con muchas cartas chicas el crupier llega a 17 sin pasarse y tus dobles fallan.","El conteo te dice cuál de las dos situaciones tenés, sin memorizar ninguna carta."]),ie("Salieron muchas cartas chicas. ¿Qué queda en el zapato?",["Más cartas altas","Más cartas chicas","Lo mismo de siempre"],0,"Si las chicas ya salieron, en proporción quedan más altas."),ie("¿Por qué un zapato con muchas cartas altas te favorece?",["Porque el crupier está obligado a pedir con 12 a 16 y se pasa más","Porque el crupier juega peor","Porque las cartas altas pagan más"],0,"Y además salen más blackjacks y tus dobles mejoran."),ie("¿Contar cartas es memorizar todas las cartas que salieron?",["Sí","No: es llevar un solo número que sube y baja"],1,"Con Hi-Lo llevás un solo número. Lo ves en la próxima lección.")]},{id:"l17",title:"Los valores de las cartas",sum:["Hi-Lo: del 2 al 6 valen +1; 7, 8 y 9 valen 0; dieces, figuras y ases valen −1.","Sumá el valor de cada carta que ves: ese total es el conteo corrido (running count).","Un mazo completo suma 0."],steps:[...da([{bank:100,rc:0,left:6,say:"Volvés a la mesa, ahora para contar. El sistema **Hi-Lo** le da a cada carta un valor: **+1, 0 o −1**. Mirá qué pasa cuando salen cartas."},{bet:10,bank:90,d:["5d","Kc?"],p:["3h","6s"],tags:!0,say:"Te tocan un 3 y un 6, y el crupier muestra un 5. Las tres son **bajas (del 2 al 6)**: cada una vale **+1**."},{rc:3,tags:!0,say:"Salieron tres cartas bajas: en el zapato quedan más altas que antes, y eso te conviene. El **conteo corrido** (*running count*) sube a **+3**."},{p:["3h","6s","8c"],tags:!0,say:"Pedís y sale un 8. **El 7, el 8 y el 9 valen 0**: no cambian nada. Seguís en **+3**."},{d:["5d","Kc"],tags:!0,ask:{q:"El crupier da vuelta una K. ¿Cuánto vale?",o:["+1","0","−1"],a:2,x:"Las altas (10, J, Q, K y As) valen −1: quedan menos cartas altas en el zapato."}},{rc:2,d:["5d","Kc","9h"],stamp:{d:"bust",p:"win"},bank:110,tags:!0,say:"La K resta 1: **+2**. El crupier pide y saca un 9, neutro: tiene **24**, se pasó. Terminás la ronda con conteo **+2**."}]),se("Los valores",["Cuando sale una carta baja, quedan más altas: es bueno para vos, **sumá 1**.","Cuando sale una alta, **restá 1**. Las del medio no cambian nada.","Sumá a medida que ves cada carta. Ese total es tu **conteo corrido** (*running count*)."],{v:"values"}),{t:"deal",title:"Miralo en acción",intro:"Estas son las cartas de una ronda. Repartilas de a una y sumá el valor de cada una.",cards:["2s","5h","Kc","6d","9s","3h"],after:["Salieron cuatro cartas bajas y una alta: el zapato que queda tiene más cartas altas de lo normal.","Tu conteo corrido es **+3**. Cuánto pesa eso depende de cuántos mazos quedan: lo ves en la lección 19."]},{t:"tags",title:"Probalo",cards:["5h","Ks","8d","2c","Ah"]},ie("¿Cuánto vale un 7 en Hi-Lo?",["+1","0","−1"],1,"El 7, el 8 y el 9 son neutros."),ie("¿Cuánto vale un As en Hi-Lo?",["+1","0","−1"],2,"El As es carta alta: −1."),ie("Un mazo completo tiene 20 cartas de +1, 12 de 0 y 20 de −1. ¿Cuánto suma?",["0","+20","−20"],0,"Las +1 y
