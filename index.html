  function setLang(lang) {

    document.querySelectorAll("[data-img]").forEach((el) => { el.src = `img/${el.dataset.img}-${lang}.webp`; });

      if (el.dataset.src !== src) { el.dataset.src = src; if (el.src) { el.src = src; el.play().catch(() => {}); } }
    });
    document.title = lang === "en" ? "Edge 21 · Blackjack and card counting" : "Edge 21 · Blackjack y conteo de cartas";
    document.querySelectorAll(".lang button").forEach((b) => b.classList.toggle("on", b.dataset.lang === lang));
    const play = document.getElementById("play");
    play.textContent = PUBLISHED ? t.play : t.soon;
    play.className = PUBLISHED ? "btn gold" : "btn soon";
    if (PUBLISHED) play.href = PLAY_URL; else play.removeAttribute("href");
