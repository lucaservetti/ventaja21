 un 3. Con 12 solo te pasás si sale una carta de 10."},{bank:90,dots:{n:31,label:"31 de cada 100 cartas valen 10"},say:"Eso es unas **31 de cada 100** cartas. Las otras 69 te mejoran."},{outcomes:{plays:["S","H"],net:!0},say:"Y un crupier con 3 no se pasa tanto como parece. En 100 manos, pedir pierde unas 2 apuestas menos que plantarse."},{act:"H",say:"Tocá **Pedir**."},{p:["10d","2s","7h"],act:"S",say:"Un 7: **19**. Tocá **Plantarse**."},{d:["3c","9s"],meter:!0,say:"El crupier da vuelta un 9: tiene 12 y pide."},{d:["3c","9s","5d"],stamp:{p:"win"},bank:110,say:"Sacó un 5: **17**, se planta. Tu 19 gana."}]),De("4",["10s","2d"],"S","Plantate 12 contra 4: el crupier se pasa unas 39 de cada 100 veces."),De("9",["10d","4c"],"H","Pedí 14 contra 9: con un 9 el crupier llega a 19 seguido."),De("3",["9h","3s"],"H","Pedí 12 contra 3: es la excepción de la regla.")]},{id:"l9",title:"El 18 blando",sum:["18 blando (A,7): plantate contra 2, 7 y 8.","Doblalo contra 3 a 6 (si no podés doblar, plantate).","Pedí contra 9, 10 y As: ahí 18 pierde más de lo que gana."],steps:[Z("Una mano engañosa",["A,7 suma 18 y parece buena mano. Pero se juega de **tres maneras distintas** según la carta del crupier."],{v:"chart",tab:"soft",rows:[18]}),...pa([{bank:100,bet:10,d:["5d","10s?"],p:["Ah","7c"],say:"Apostaste 10 y tenés A y 7: **18 blando** contra un 5."},{bank:90,act:"D",say:"El crupier está débil y tu mano no se pasa con una carta. Doblá: tocá **Doblar**."},{bet:20,bank:80,p:["Ah","7c","3s"],say:"Pusiste 10 más y recibís una sola carta: un 3. **21**."},{d:["5d","10s"],meter:!0,say:"El crupier da vuelta un 10: tiene 15 y pide."},{d:["5d","10s","8h"],stamp:{d:"bust",p:"win"},bank:120,say:"Un 8: **23**, se pasó. Cobrás 20 por tu apuesta doblada."}]),Z("La regla",["**Contra 2, 7 u 8: plantate.**","**Contra 3 a 6: doblá** (si no podés doblar, plantate).","**Contra 9, 10 o As: pedí.** No te podés pasar con una carta, y contra cartas fuertes 18 pierde más de lo que gana."]),De("9",["Ah","7c"],"H","Pedí: contra 9, un 18 pierde más de lo que gana y una carta no te puede pasar."),De("5",["As","7d"],"D","Doblá: el crupier con 5 está débil y tu mano no se pasa con una carta."),De("7",["Ad","7s"],"S","Plantate: tu 18 le gana al 17 probable del crupier."),De("A",["Ac","7h"],"H","Pedí: contra As, 18 blando pierde."),De("2",["Ah","7s"],"S","Plantate contra 2 (en mesas S17; en mesas H17 se dobla)."),Z("Las demás blandas",["**A,8 y A,9:** plantate siempre (en mesas H17, A,8 contra 6 se dobla).","**A,2 a A,6:** pedí, salvo contra un crupier débil, donde se doblan. Lo ves en la próxima lección."])]},{id:"l10",title:"Cuándo doblar",sum:["Doblar es duplicar la apuesta a cambio de una sola carta más, con tus dos primeras cartas.","11 se dobla contra todo menos As; 10 contra 2 a 9; 9 contra 3 a 6.","Las blandas chicas se doblan contra un crupier débil, sobre todo contra 5 y 6."],steps:[Z("Doblar",["Doblar es **duplicar tu apuesta** a cambio de recibir **una sola carta más**.","Se hace con tus dos primeras cartas, cuando sos favorito en la mano."]),...pa([{bank:100,bet:10,d:["6c","Qh?"],p:["6h","5d"],say:"Apostaste 10 y tenés **11** contra un 6."},{bank:90,act:"D",say:"Es la mejor mano para doblar: casi un tercio de las cartas te dejan en 21. Tocá **Doblar**."},{bet:20,bank:80,p:["6h","5d","Kd"],say:"Una K: **21**, con el doble apostado."},{d:["6c","Qh"],meter:!0,say:"El crupier tiene 16 y pide."},{d:["6c","Qh","4s"],say:"Un 4: **20**. Se planta."},{stamp:{p:"win"},bank:120,say:"Tu 21 gana y cobrás 20: el doble que sin doblar."}]),Z("Los dobles duros",["**11:** doblá contra todo, menos contra As (en mesas H17, también contra As).","**10:** doblá contra 2 a 9.","**9:** doblá contra 3 a 6."],{v:"chart",tab:"hard",rows:[11,10,9]}),Z("Los dobles blandos",["Contra **5 y 6**: doblá de A,2 a A,7.","Contra **4**: de A,4 a A,7.","Contra **3**: A,6 y A,7.","Contra **2**: ninguna (en mesas H17, A,7)."],{v:"chart",tab:"soft",rows:[18,17,16,15,14,13]}),De("10",["6c","4s"],"H","Pedí 10 c
