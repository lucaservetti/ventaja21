 el As vale 1.","Cuando el As tiene que valer 1, la mano pasa a ser dura (hard)."],steps:[F("Duras y blandas",["Una mano es **blanda** (en inglés, *soft*) si tiene un As que vale 11.","Es **dura** (*hard*) si no tiene As, o si el As tiene que valer 1 para no pasarte."],{v:"hands2",a:{cards:["Ah","6s"],label:"Blando 17"},b:{cards:["10d","7c"],label:"Duro 17"}}),...ea([{bank:100,bet:10,d:["9d","7c?"],p:["Ah","6s"],say:"Apostaste 10 y tenés A y 6: **17 blando**. El crupier muestra un 9."},{bank:90,act:"H",say:"Con 17 blando no te podés pasar pidiendo una carta, y contra un 9 un 17 casi nunca gana. Tocá **Pedir**."},{p:["Ah","6s","8d"],say:"Salió un 8. Con el As como 11 serían 25: el As pasa a valer 1 y tenés **15**. No te pasaste."},{ask:{q:"Con A, 6 y 8, ¿tu mano es blanda o dura?",o:["Blanda","Dura"],a:1,x:"El As ya tiene que valer 1: es un 15 duro. Ahora sí te podés pasar."}},{act:"H",say:"Con 15 duro contra un 9 se sigue pidiendo. Tocá **Pedir**."},{p:["Ah","6s","8d","4h"],act:"S",say:"Un 4: **19**. Ahora sí, tocá **Plantarse**."},{d:["9d","7c"],meter:!0,say:"El crupier da vuelta un 7: tiene 16 y pide."},{d:["9d","7c","Ks"],stamp:{d:"bust",p:"win"},bank:110,say:"Una K: **26**, se pasó. Ganás 10. La carta gratis del 17 blando te llevó a 19."}]),te("¿Qué mano es?",["Duro 16","Blando 16","Blando 6"],1,"Tiene un As que vale 11: es blando 16.",{cards:["Ac","5d"]}),te("¿Qué mano es A, 5 y 10?",["Blando 16","Duro 16","Te pasaste"],1,"Con el 10, el As como 11 te pasaría (26), así que vale 1: duro 16.",{cards:["Ac","5d","10s"]}),te("Tenés A,4 (blando 15). Si pedís una carta, ¿te podés pasar?",["Sí, con un 10","No, con ninguna carta"],1,"Con un 10 tendrías 25 si el As valiera 11, pero pasa a valer 1: duro 15. Desde una blanda nunca te pasás con una sola carta.")]},{id:"l5",title:"Por qué gana la casa",sum:["La ventaja de la casa sale de una sola regla: si te pasás, perdés aunque el crupier también se pase.","Imitando al crupier perdés alrededor de 5,5 %; con estrategia básica, cerca de 0,5 %.","Plantarte cuando quieras, doblar, separar y cobrar 3:2 son tus armas."],steps:[F("Vos jugás primero",["Si los dos jugaran igual, el juego sería parejo. La diferencia está en el orden: **vos jugás primero**.","Si te pasás, perdés aunque después el crupier también se pase."],{v:"outcomes",items:[{l:"Te pasás vos",r:"Perdés",tone:"bad"},{l:"Se pasa el crupier",r:"Ganás",tone:"good"},{l:"Se pasan los dos",r:"Perdés",tone:"bad"}]}),F("Cuánto vale esa ventaja",["Un jugador que **imita al crupier** (pide hasta 17 y nunca dobla ni separa) pierde alrededor de **5,5 %** de lo que apuesta.","Con la **estrategia básica**, la ventaja de la casa baja a alrededor de **0,5 %**. Y contando cartas la podés dar vuelta."],{v:"tiles",items:[{v:"5,5 %",l:"imitando al crupier",tone:"bad"},{v:"0,5 %",l:"con estrategia básica",tone:"mid"},{v:"+1 %",l:"a tu favor contando",tone:"good"}]}),F("Lo que vos tenés y el crupier no",["Para compensar, tenés opciones que el crupier no tiene: plantarte cuando quieras, **doblar** (*double*), **separar** (*split*) y cobrar el blackjack 3 a 2."]),F("La estrategia básica",["La mejor jugada para cada mano ya se conoce: se llama **estrategia básica**. La calcularon en 1956 cuatro matemáticos del ejército de Estados Unidos, con calculadoras de escritorio, y las computadoras la fueron afinando."],{v:"chart",tab:"hard"}),F("Cómo la vas a aprender",["La sección 2 te la enseña de a un tipo de mano.",'El 0,5 % solo vale si la seguís **en todas las manos**: cada jugada "por intuición" te cuesta plata.'],{v:"chart",tab:"hard"}),te("¿De dónde sale la ventaja de la casa?",["El crupier tiene mejores cartas","Si te pasás perdés, aunque el crupier también se pase","Las cartas están arregladas"],1,"Es la única asimetría del juego, y alcanza para que la casa gane a la larga."),te('¿Qué hace un jugador que "imita al crupier"?',["Pide hasta 17 y nunca dobla ni separa","Se planta siempre con 12","Dobla todas las manos"],0,"Y pierde alrededor de 5,5 %: unas diez veces más que con la estrategia básica."),te("Con estrategia básica perfecta, ¿cuánto pierde un jugador a la larga?",["Nada: el juego queda parejo","Alrededor de 0,5 % de lo que apuesta","Alrededor de 10 %"],1,"Depende de las reglas de la mesa, pero en un buen casino ronda el 0,5 %.")]}]},{id:2,title:"Cómo jugar tu mano",desc:"La jugada correcta para cada mano que te puede tocar",icon:"h",lessons:[{id:"l6",title:"Leer la carta del crupier",sum:["Cada decisión usa dos datos: tu total y la carta visible del crupier.","Con 2 a 6 visible el crupier se pasa seguido: arriesgá menos y dejalo pedir.","Con 7 a As casi siempre arma una mano: necesitás un total de verdad."],steps:[...ea([{bank:100,d:["5d","X?"],p:["Kc","3h"],hl:"both",say:"Sección 2: misma mesa, otra habilidad. Desde ahora, cada decisión usa dos datos: **tu total** y **la carta visible del crupier**. Esa carta te dice cómo suele terminar su mano."},{bust:{hl:[5,6,10]},say:"Primero los números. Si muestra un 5 o un 6, el crupier se pasa unas **42 de cada 100** veces. Si muestra un 10, unas **23**. Las mismas reglas, casi el doble de veces."},{bust:{hl:[5,10]},ask:{q:"Tu 13 necesita que el crupier se pase. ¿Qué carta visible le conviene?",o:["Un 5","Un 10"],a:0,x:"El 5. Con un 5 el crupier se pasa casi el doble de veces, así que plantarte y esperar pasa a ser una opción real."}},{bust:{groups:!0},say:"Hay dos grupos. **Del 2 al 6:** el crupier se pasa seguido, así que arriesgás menos y lo dejás pedir. **Del 7 al As:** casi siempre arma una mano, así que necesitás un total de verdad."},{reset:!0,bank:90,bet:10,d:["5d","10s?"],p:["7c","5s"],bustMini:!0,say:"Usalo ahora. Apostaste 10 y tenés **12 duro** contra un 5."},{play:{a:"S",x:"Te plantás y el riesgo lo corre el crupier: con un 5 se pasa unas 42 de cada 100 veces, y plantarte solo pierde cuando él arma una mano."},say:"12 contra un 5. ¿Pedís o te plantás?"},{d:["5d","10s","9c"],bustMini:!1,meter:!0,stamp:{d:"bust"},say:"El crupier da vuelta un 10: 15,  que tiene que pedir es el crupier. Con un 6 se pasa unas 42 de cada 100 veces, y pedir te arriesgaba a pasarte primero."},say:"14 contra un 6. Decí la regla y tocá."},{d:["6s","10d","Kc"],bustMini:!1,meter:!0,stamp:{d:"bust"},say:"Da vuelta un 10: 16, y está obligado a pedir. Una K: **26**, se pasó."},{stamp:{d:"bust",p:"win"},bank:110,say:"Cobrás tus 10."},{reset:!0,bank:100,bet:10,d:["2s","8s?"],p:["8h","5c"],bustMini:!0,say:"Segunda ronda: la excepción. Mano nueva."},{play:{a:"S",x:"Te plantás. El 2 no es tan débil como un 4, 5 o 6, pero con 13 o más igual te plantás. Solo el 12 pide contra 2 o 3."},say:"13 contra un 2. Cuidado con esta."},{d:["2s","8s","7d"],bustMini:!1,meter:!0,stamp:{p:"lose"},say:"Da vuelta un 8: tiene 10. Pide y saca un 7: **17**. Tu 13 pierde y se van los 10."},{chart:{tab:"hard",rows:[16,15,14,13,12],hl:[13,0]},say:"La jugada igual era la correcta. Las jugadas correctas pierden seguido, y un resultado no cambia cuál es la mejor jugada."}]),...ea([{bank:100,bet:10,d:["3c","9s?"],p:["10d","2s"],say:"Apostaste 10 y tenés 12 contra un 3. Con 12 solo te pasás si sale una carta de 10."},{bank:90,dots:{n:31,label:"31 de cada 100 cartas valen 10"},say:"Eso es unas **31 de cada 100** cartas. Las otras 69 te mejoran."},{outcomes:{plays:["S","H"],net:!0},say:"Y un crupier con 3 no se pasa tanto como parece. En 100 manos, pedir pierde unas 2 apuestas menos que plantarse."},{act:"H",say:"Tocá **Pedir**."},{p:["10d","2s","7h"],act:"S",say:"Un 7: **19**. Tocá **Plantarse**."},{d:["3c","9s"],meter:!0,say:"El crupier da vuelta un 9: tiene 12 y pide."},{d:["3c","9s","5d"],stamp:{p:"win"},bank:110,say:"Sacó un 5: **17**, se planta. Tu 19 gana."}]),Be("4",["10s","2d"],"S","Plantate 12 contra 4: el crupier se pasa unas 39 de cada 100 veces."),Be("9",["10d","4c"],"H","Pedí 14 contra 9: con un 9 el crupier llega a 19 seguido."),Be("3",["9h","3s"],"H","Pedí 12 contra 3: es la excepción de la regla.")]},{id:"l9",title:"El 18 blando",sum:["18 blando (A,7): plantate contra 2, 7 y 8.","Doblalo contra 3 a 6 (si no podés doblar, plantate).","Pedí contra 9, 10 y As: ahí 18 pierde más de lo que gana."],steps:[F("Una mano engañosa",["A,7 suma 18 y parece buena mano. Pero se juega de **tres maneras distintas** según la carta del crupier."],{v:"chart",tab:"soft",rows:[18]}),...ea([{bank:100,bet:10,d:["5d","10s?"],p:["Ah","7c"],say:"Apostaste 10 y tenés A y 7: **18 blando** contra un 5."},{bank:90,act:"D",say:"El crupier está débil y tu mano no se pasa con una carta. Doblá: tocá **Doblar**."},{bet:20,bank:80,p:["Ah","7c","3s"],say:"Pusiste 10 más y recibís una sola carta: un 3. **21**."},{d:["5d","10s"],meter:!0,say:"El crupier da vuelta un 10: tiene 15 y pide."},{d:["5d","10s","8h"],stamp:{d:"bust",p:"win"},bank:120,say:"Un 8: **23**, se pasó. Cobrás 20 por tu apuesta doblada."}]),F("La regla",["**Contra 2, 7 u 8: plantate.**","**Contra 3 a 6: doblá** (si no podés doblar, plantate).","**Contra 9, 10 o As: pedí.** No te podés pasar con una carta, y contra cartas fuertes 18 pierde más de lo que gana."]),Be("9",["Ah","7c"],"H","Pedí: contra 9, un 18 pierde más de lo que gana y una carta no te puede pasar."),Be("5",["As","7d"],"D","Doblá: el crupier con 5 está débil y tu mano no se pasa con una carta."),Be("7",["Ad","7s"],"S","Plantate: tu 18 le gana al 17 que el crupier suele armar."),Be("A",["Ac","7h"],"H","Pedí: contra As, 18 blando pierde."),Be("2",["Ah","7s"],"S","Plantate contra 2 (en mesas S17; en mesas H17 se dobla)."),F("Las demás blandas",["**A,8 y A,9:** plantate siempre (en mesas H17, A,8 contra 6 se dobla).","**A,2 a A,6:** pedí, salvo contra un crupier débil, donde se doblan. Lo ves en la próxima lección."])]},{id:"l10",title:"Cuándo doblar",sum:["Doblar es duplicar la apuesta a cambio de una sola carta más, con tus dos primeras cartas.","11 se dobla contra todo menos As; 10 contra 2 a 9; 9 contra 3 a 6.","Las blandas chicas se doblan contra un crupier débil, sobre todo contra 5 y 6."],steps:[F("Doblar",["Doblar (en inglés, *double* o *double down*) es **duplicar tu apuesta** a cambio de recibir **una sola carta más**.","Se hace con tus dos primeras cartas, cuando sos favorito en la mano."]),...ea([{bank:100,bet:10,d:["6c","Qh?"],p:["6h","5d"],say:"Apostaste 10 y tenés **11** contra un 6."},{bank:90,act:"D",say:"Es la mejor mano para doblar: casi un tercio de las cartas te dejan en 21. Tocá **Doblar**."},{bet:20,bank:80,p:["6h","5d","Kd"],say:"Una K: **21**, con el doble apostado."},{d:["6c","Qh"],meter:!0,say:"El crupier tiene 16 y pide."},{d:["6c","Qh","4s"],say:"Un 4: **20**. Se planta."},{stamp:{p:"win"},bank:120,say:"Tu 21 gana y cobrás 20: el doble que sin doblar."}]),F("Los dobles duros",["**11:** doblá contra todo, menos contra As (en mesas H17, también contra As).","**10:** doblá contra 2 a 9.","**9:** doblá contra 3 a 6."],{v:"chart",tab:"hard",rows:[11,10,9]}),F("Los dobles blandos",["Contra **5 y 6**: doblá de A,2 a A,7.","Contra **4**: de A,4 a A,7.","Contra **3**: A,6 y A,7.","Contra **2**: ninguna (en mesas H17, A,7)."],{v:"chart",tab:"soft",rows:[18,17,16,15,14,13]}),Be("10",["6c","4s"],"H","Pedí 10 contra 10: el crupier tiene una carta tan buena como la tuya."),Be("2",["5h","4c"],"H","Pedí 9 contra 2: el 9 solo se dobla contra 3 a 6."),Be("4",["Ad","4c"],"D","Doblá A,4 contra 4."),Be("4",["As","2h"],"H","Pedí A,2 contra 4: A,2 y A,3 se doblan solo contra 5 y 6."),Be("A",["7d","4s"],"H","Pedí 11 contra As (en mesas S17)."),te("Pediste con 5,4 y te salió un 2: tenés 11 con tres cartas contra un 6. ¿Podés doblar?",["Sí","No: solo se dobla con las dos primeras cartas"],1,"Con tres cartas ya no se puede doblar: pedí.")]},{id:"l11",title:"Separar ases y ochos",sum:["Separar es dividir un par en dos manos, poniendo otra apuesta igual.","Separá siempre los ases y los ochos.","Después de separar, As + 10 es 21 común, no blackjack."],steps:[F("Separar",["Con dos cartas iguales podés **separarlas** (en inglés, *split*): ponés otra apuesta igual a la primera y cada carta arranca una mano nueva."],{v:"cards",cards:["8h","8c"],caption:"Un par de 8"}),...ea([{bank:100,bet:10,d:["10s","7d?"],p:["8h","8c"],say:"Apostaste 10 y tenés un par de 8 contra un 10. Juntos son **16**, la peor mano del juego."},{bank:90,act:"P",say:"Separalos: tocá **Separar**."},{hands:[["8h"],["8c"]],bank:80,say:"Ponés otra apuesta de 10 y cada 8 arranca su propia mano."},{hands:[["8h","3d"],["8c","Kc"]],say:"Llega una carta a cada una: **11** y **18**. Dos manos mucho mejores que un 16."},{say:"Desde ahí, cada mano se juega por separado, como cualquier otra. Separando los 8 contra un 10 perdés menos que jugando el 16."}]),F("Los ases: siempre",["Dos ases juntos suman un 12 flojo. Separados, cada As arranca en 11 y cualquier carta de 10 te deja en 21.","**Separá los ases siempre.** En casi todos los casinos recibís una sola carta por As, y A + 10 después de separar es 21, no blackjack."]),F("Los ochos: siempre",["8,8 es 16, la peor mano del juego. Separados, cada 8 arranca una mano mucho mejor.","Incluso contra 10 o As: separando perdés menos que jugando el 16. Única excepción: en mesas H17 con rendición, contra As conviene rendirse."]),Be("10",["8d","8s"],"P","Separá: dos manos que arrancan en 8 pierden menos que un 16."),Be("6",["Ah","Ad"],"P","Separá siempre los ases."),Be("A",["8c","8h"],"P","Separá (en mesas S17; con H17 y rendición, rendite)."),te("Separaste ases y en uno te salió una K. ¿Tenés blackjack?",["Sí, cobro 3 a 2","No: es 21 y se paga 1 a 1"],1,"Después de separar, A + 10 cuenta como 21 común.")]},{id:"l12",title:"Pares que nunca se separan",sum:["Nunca separes los dieces: 20 gana casi siempre.","Nunca separes los cincos: jugalos como un 10.","9,9 se separa contra 2 a 9, menos contra 7; el 4,4 solo contra 5 y 6."],steps:[...ea([{bank:100,bet:10,d:["6d","9c?"],p:["Kh","Ks"],say:"Apostaste 10 y tenés dos K contra un 6. Es tentador separar contra un crupier débil…"},{bank:90,act:"S",say:"…pero 20 ya es una mano ganadora. Nunca separes los dieces: tocá **Plantarse**."},{d:["6d","9c"],meter:!0,say:"El crupier da vuelta un 9: tiene 15 y pide."},{d:["6d","9c","Jh"],stamp:{d:"bust",p:"win"},bank:110,say:"Una J: **25**, se pasó. Tu 20 cobra."}]),F("Nunca separes los dieces",["10,10 es 20: gana casi siempre.","Separarlos es cambiar una mano ganadora por dos manos que arrancan en 10."]),F("Nunca separes los cincos",["5,5 es 10, una gran mano para doblar.","Jugala como un 10: doblá contra 2 a 9 y pedí contra 10 y As."]),F("El resto de los pares",["**9,9:** separá contra 2 a 9, menos contra 7 (plantate: tu 18 le gana a su 17 probable). Contra 10 y As, plantate.","**7,7:** separá contra 2 a 7. **6,6:** contra 2 a 6. **2,2 y 3,3:** contra 2 a 7. **4,4:** solo contra 5 y 6.","Si la mesa **no deja doblar después de separar**: el 6,6 se separa contra 3 a 6, el 2,2 y el 3,3 contra 4 a 7, y el 4,4 nunca."],{v:"chart",tab:"pairs"}),Be("8",["5c","5d"],"D","Doblá: 5,5 se juega como un 10."),Be("7",["9h","9c"],"S","Plantate: 18 le gana al 17 probable del crupier."),Be("9",["9s","9d"],"P","Separá: contra 9 dos manos de 9 rinden más que un 18."),Be("3",["4h","4s"],"H","Pedí: el 4,4 solo se separa contra 5 y 6."),Be("7",["7c","7h"],"P","Separá los 7 contra 7.")]},{id:"lt",title:"La tabla completa",sum:["La tabla junta todo: tu mano en las filas, la carta del crupier en las columnas.","H pedir, S plantarse, D doblar, P separar: las letras que vas a ver en todo el mundo.","Primero fijate si tenés un par, después si es blanda; si no, es dura."],steps:[F("Todo en una tabla",["Ya sabés jugar cada tipo de mano. La **tabla de estrategia básica** (*basic strategy*) las junta todas: en cada casilla está la jugada que más plata te deja, o la que menos te hace perder.","Las letras son las que se usan en todo el mundo: **H** pedir (*hit*), **S** plantarse (*stand*), **D** doblar (*double*) y **P** separar (*split*)."],{v:"chart",tab:"hard"}),F("Cómo se lee",["Buscá **tu mano** en la columna de la izquierda y la **carta visible del crupier** arriba. Don  y trampas",desc:"Las trampas que te cuestan plata antes de que salga una carta",icon:"d",lessons:[{id:"l13",title:"Mesas 3:2 y 6:5",sum:["Fijate en el cartel: el blackjack tiene que pagar 3:2.","Una mesa 6:5 le suma a la casa alrededor de 1,4 %.","Que el crupier pida con 17 blando o no poder doblar después de separar también te cuesta."],steps:[F("El cartelito que importa",["En la mesa vas a ver cuánto paga el blackjack: **3 a 2** o **6 a 5**.","Parece un detalle, pero es la regla que más plata te cuesta."],{v:"payout"}),...ea([{bank:100,bet:10,d:["9h","7s?"],p:["As","Kh"],stamp:{p:"bj"},say:"Apostaste 10 y te salió blackjack. En una mesa **3:2**, cobrás 15."},{bank:115,say:"Recuperás tus 10 y cobrás 15: quedás con 115."},{say:"En una mesa **6:5**, el mismo blackjack paga 12: te quedarían 112. Parece poco, pero te sale un blackjack más o menos una vez cada 21 manos, toda la noche."}]),F("Cuánto cuesta",["Cobrar 6:5 en vez de 3:2 le suma a la casa alrededor de **1,4 %**: casi el triple de toda la ventaja que tiene contra la estrategia básica."]),F("Otras reglas que importan",["**A tu favor:** que el crupier se plante con 17 blando, doblar después de separar, la rendición y el corte del zapato bien atrás.","**En contra:** pagar 6:5, que el crupier pida con 17 blando y no poder doblar después de separar."]),te("Apostás 10 en una mesa 6:5 y sacás blackjack. ¿Cuánto ganás?",["15","12","10"],1,"6 a 5: por cada 5 cobrás 6. Con 10, 12."),te("Hay una mesa 3:2 con mínimo 25 y una 6:5 con mínimo 10. Vas a apostar 25 por mano. ¿Cuál conviene?",["La 6:5, es más barata","La 3:2"],1,"Si vas a apostar lo mismo, la 3:2 te cuesta mucho menos a la larga."),te("¿Qué regla le suma ventaja a la casa?",["El crupier se planta con 17 blando","El crupier pide con 17 blando","Se permite rendirse"],1,"Cuando el crupier pide con 17 blando a veces mejora su mano: la casa gana alrededor de 0,2 % más.")]},{id:"l14",title:"El seguro",sum:["El seguro es una apuesta aparte a que el crupier tiene blackjack; paga 2 a 1.","Sin contar cartas pierde alrededor de 7 %: no lo tomes.","El pago parejo es lo mismo que el seguro: tampoco conviene."],steps:[F("Qué es",["Cuando el crupier muestra un As, te ofrece un **seguro** (*insurance*): apostás la mitad de tu apuesta a que tiene blackjack.","Si lo tiene, el seguro paga **2 a 1**."],{v:"cards",cards:["Ah","X"],caption:"El crupier muestra As"}),...ea([{bank:100,bet:10,d:["Ah","7s?"],p:["10c","Qd"],say:"Apostaste 10 y tenés 20. El crupier muestra un As y te ofrece el **seguro**: apostar 5 más a que tiene blackjack."},{bank:90,ask:{q:"¿Tomás el seguro?",o:["Sí, para proteger mi 20","No"],a:1,x:"El seguro no protege tu mano: es una apuesta aparte sobre su carta tapada, y sin contar cartas pierde plata."}},{d:["Ah","7s"],meter:!0,say:"El crupier mira su carta: no tiene blackjack. Tiene **18** y se planta."},{stamp:{p:"win"},bank:110,say:"Tu 20 gana. Si hubieras tomado el seguro, además habrías perdido 5."}]),F("Por qué pierde",["Para que el seguro no pierda plata, más de un tercio de las cartas que quedan tendrían que valer 10.","Normalmente son 4 de cada 13 (31 %). Por eso el seguro pierde alrededor de **7 %** a la larga."],{v:"tiles",items:[{v:"33 %",l:"de dieces para empatar",tone:"mid"},{v:"31 %",l:"lo que hay normalmente",tone:"bad"}]}),F("El pago parejo",["Si tenés blackjack y el crupier muestra As, te ofrecen **pago parejo** (even money): cobrar 1 a 1 en el acto.","Es exactamente lo mismo que tomar el seguro, así que tampoco conviene."]),te("¿Cuánto paga el seguro?",["1 a 1","2 a 1","3 a 2"],1,"Paga 2 a 1 si el crupier tiene blackjack."),te("¿Cuándo sí conviene el seguro?",["Nunca","Cuando contás cartas y quedan muchos dieces","Cuando tenés blackjack"],1,"Con el conteo alto quedan suficientes dieces. Lo ves en la sección 4.")]},{id:"l15",title:"Cuándo levantarse",sum:["Las rachas no cambian tus chances: solo importa qué cartas quedan.","Decidí cuánto jugar y cuánto podés perder antes de sentarte.","Ningún sistema de apuestas, como la martingala, le gana a la casa."],steps:[F("Las rachas no existen",['Haber perdido cinco manos seguidas no hace que "te toque ganar".',"Lo único que cambia tus chances es **qué cartas quedan en el zapato**, y eso es justamente lo que mide el conteo."]),F("Tus límites, antes de sentarte",["Decidí cuánto vas a jugar y cuánto podés perder **antes** de llegar.","Jugá solo plata que no necesitás. Apostar más para recuperar es la forma más rápida de perder mucho."]),F("Los sistemas de apuestas",["Duplicar la apuesta después de perder (la martingala) y otras progresiones **no cambian la ventaja**: solo cambian cuándo y cuánto perdés.","El conteo funciona porque mira las cartas, no los resultados anteriores."]),te("Perdiste cinco manos seguidas. ¿La próxima tenés más chances de ganar?",["Sí, ya me toca","No: los resultados anteriores no cambian nada"],1,"Las cartas no se acuerdan de lo que ganaste o perdiste."),te("¿Qué hace la martingala (doblar la apuesta después de perder)?",["Le gana a la casa","No cambia la ventaja y arriesga mucho para ganar poco"],1,"Ganás seguido de a poco, pero cuando llega una racha larga perdés todo junto."),te("¿Cuándo conviene decidir tu límite de pérdida?",["Antes de empezar a jugar","Cuando ya perdí bastante","No hace falta"],0,"En caliente se decide mal. Y si el juego deja de ser entretenimiento, frená y pedí ayuda.")]}]},{id:4,title:"El conteo",desc:"Contá el zapato y quedate con la ventaja",icon:"c",lessons:[{id:"l16",title:"Por qué funciona contar",sum:["Las cartas que salen no vuelven hasta la próxima mezcla.","Si quedan muchas cartas altas, la ventaja pasa a tu lado.","Contar no es memorizar cartas: es llevar un solo número."],steps:[F("Las cartas que salen no vuelven",["En un zapato, las cartas repartidas no vuelven hasta la próxima mezcla.","Si salieron muchas cartas chicas, quedan más cartas altas. Y al revés."]),...ea([{row:["2c","5d","3h","6s","4c","5h","2d","9s"],say:"Supongamos que en las primeras manos del zapato ido** (*running count*) sube a **+3**."},{p:["3h","6s","8c"],tags:!0,say:"Pedís y sale un 8. **El 7, el 8 y el 9 valen 0**: no cambian nada. Seguís en **+3**."},{d:["5d","Kc"],tags:!0,ask:{q:"El crupier da vuelta una K. ¿Cuánto vale?",o:["+1","0","−1"],a:2,x:"Las altas (10, J, Q, K y As) valen −1: quedan menos cartas altas en el zapato."}},{rc:2,d:["5d","Kc","9h"],stamp:{d:"bust",p:"win"},bank:110,tags:!0,say:"La K resta 1: **+2**. El crupier pide y saca un 9, neutro: tiene **24**, se pasó. Terminás la ronda con conteo **+2**."}]),F("Los valores",["Cuando sale una carta baja, quedan más altas: es bueno para vos, **sumá 1**.","Cuando sale una alta, **restá 1**. Las del medio no cambian nada.","Sumá a medida que ves cada carta. Ese total es tu **conteo corrido** (*running count*)."],{v:"values"}),{t:"deal",title:"Miralo en acción",intro:"Estas son las cartas de una ronda. Repartilas de a una y sumá el valor de cada una.",cards:["2s","5h","Kc","6d","9s","3h"],after:["Salieron cuatro cartas bajas y una alta: el zapato que queda tiene más cartas altas de lo normal.","Tu conteo corrido es **+3**. Cuánto pesa eso depende de cuántos mazos quedan: lo ves en la lección 19."]},{t:"tags",title:"Probalo",cards:["5h","Ks","8d","2c","Ah"]},te("¿Cuánto vale un 7 en Hi-Lo?",["+1","0","−1"],1,"El 7, el 8 y el 9 son neutros."),te("¿Cuánto vale un As en Hi-Lo?",["+1","0","−1"],2,"El As es carta alta: −1."),te("Un mazo completo tiene 20 cartas de +1, 12 de 0 y 20 de −1. ¿Cuánto suma?",["0","+20","−20"],0,"Las +1 y las −1 se cancelan: un mazo completo suma 0. Por eso Hi-Lo es un sistema balanceado.")]},{id:"l18",title:"El conteo corrido",sum:["El conteo corrido arranca en 0 al mezclar y sigue hasta la próxima mezcla.","Contá todas las cartas que ves: las tuyas, las de los demás y las del crupier.","Cancelá de a pares: una alta y una baja juntas suman 0."],steps:[...ea([{bank:100,rc:0,left:6,others:[{name:"Ana",cards:[]}],say:"El conteo corrido arranca en **0** cuando mezclan y sigue mano
