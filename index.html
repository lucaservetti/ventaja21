,"8s"],"P","Separá: dos manos que arrancan en 8 pierden menos que un 16."),xe("6",["Ah","Ad"],"P","Separá siempre los ases."),xe("A",["8c","8h"],"P","Separá (en mesas S17; con H17 y rendición, rendite)."),I("Separaste ases y en uno te salió una K. ¿Tenés blackjack?",["Sí, cobro 3 a 2","No: es 21 y se paga 1 a 1"],1,"Después de separar, A + 10 cuenta como 21 común.")]},{id:"l12",title:"Pares que nunca se separan",sum:["Nunca separes los dieces: 20 gana casi siempre.","Nunca separes los cincos: jugalos como un 10.","9,9 se separa contra 2 a 9, menos contra 7; el 4,4 solo contra 5 y 6."],steps:[...Pe([{bank:100,bet:10,d:["6d","9c?"],p:["Kh","Ks"],say:"Apostaste 10 y tenés dos K contra un 6. Es tentador separar contra un crupier débil…"},{bank:90,act:"S",say:"…pero 20 ya es una mano ganadora. Nunca separes los dieces: tocá **Plantarse**."},{d:["6d","9c"],meter:!0,say:"El crupier da vuelta un 9: tiene 15 y pide."},{d:["6d","9c","Jh"],stamp:{d:"bust",p:"win"},bank:110,say:"Una J: **25**, se pasó. Tu 20 cobra."}]),J("Nunca separes los dieces",["10,10 es 20: gana casi siempre.","Separarlos es cambiar una mano ganadora por dos manos que arrancan en 10."]),J("Nunca separes los cincos",["5,5 es 10, una gran mano para doblar.","Jugala como un 10: doblá contra 2 a 9 y pedí contra 10 y As."]),J("El resto de los pares",["**9,9:** separá contra 2 a 9, menos contra 7 (plantate: tu 18 le gana a su 17 probable). Contra 10 y As, plantate.","**7,7:** separá contra 2 a 7. **6,6:** contra 2 a 6. **2,2 y 3,3:** contra 2 a 7. **4,4:** solo contra 5 y 6.","Si la mesa **no deja doblar después de separar**: el 6,6 se separa contra 3 a 6, el 2,2 y el 3,3 contra 4 a 7, y el 4,4 nunca."],{v:"chart",tab:"pairs"}),xe("8",["5c","5d"],"D","Doblá: 5,5 se juega como un 10."),xe("7",["9h","9c"],"S","Plantate: 18 le gana al 17 probable del crupier."),xe("9",["9s","9d"],"P","Separá: contra 9 dos manos de 9 rinden más que un 18."),xe("3",["4h","4s"],"H","Pedí: el 4,4 solo se separa contra 5 y 6."),xe("7",["7c","7h"],"P","Separá los 7 contra 7.")]},{id:"lt",title:"La tabla completa",sum:["La tabla junta todo: tu mano en las filas, la carta del crupier en las columnas.","H pedir, S plantarse, D doblar, P separar: las letras que vas a ver en todo el mundo.","Primero fijate si tenés un par, después si es blanda; si no, es dura."],steps:[J("Todo en una tabla",["Ya sabés jugar cada tipo de mano. La **tabla de estrategia básica** (*basic strategy*) las junta todas: en cada casilla está la jugada que más plata te deja, o la que menos te hace perder.","Las letras son las que se usan en todo el mundo: **H** pedir (*hit*), **S** plantarse (*stand*), **D** doblar (*double*) y **P** separar (*split*)."],{v:"chart",tab:"hard"}),J("Cómo se lee",["Buscá **tu mano** en la columna de la izquierda y la **carta visible del crupier** arriba. Donde se cruzan está la jugada.","Acá: tenés **16** y el crupier muestra un **10**. La casilla marcada dice **H**: pedí."],{v:"chart",tab:"hard",rows:[17,16,15,14,13,12],hl:[16,8]}),J("Tres tablas",["**Pares**: tus dos primeras cartas son iguales. Es lo primero que mirás, porque ahí aparece la opción de separar.","**Blandas** (*soft*): tenés un As que vale 11.","**Duras** (*hard*): todo lo demás, incluso si tenés un As que ya vale 1."]),I("Tenés A,7. ¿En qué tabla lo buscás?",["Duras","Blandas","Pares"],1,"El As vale 11, así que es un 18 blando."),I("Tenés 8,8. ¿En qué tabla lo buscás?",["Duras","Blandas","Pares"],2,"Dos cartas iguales: primero mirás la tabla de pares."),I("Tenés A, 5 y 10. ¿En qué tabla lo buscás?",["Duras","Blandas","Pares"],0,"Si el As valiera 11 te pasarías: vale 1 y tenés 16 duro.",{cards:["Ah","5c","Ts"]}),J("Las duras, en palabras",["Así se dice la tabla de duras con las reglas de tu mesa. Leela de arriba abajo: es más fácil de lo que parece."],{v:"chartWords",tab:"hard"}),J("Las blandas, en palabras",["Con las blandas casi nunca te plantás antes de 18, porque no te podés pasar con una carta."],{v:"chartWords",tab:"soft"}),J(" separar, la rendición y el corte del zapato bien atrás.","**En contra:** pagar 6:5, que el crupier pida con 17 blando y no poder doblar después de separar."]),I("Apostás 10 en una mesa 6:5 y sacás blackjack. ¿Cuánto ganás?",["15","12","10"],1,"6 a 5: por cada 5 cobrás 6. Con 10, 12."),I("Hay una mesa 3:2 con mínimo 25 y una 6:5 con mínimo 10. Vas a apostar 25 por mano. ¿Cuál conviene?",["La 6:5, es más barata","La 3:2"],1,"Si vas a apostar lo mismo, la 3:2 te cuesta mucho menos a la larga."),I("¿Qué regla le suma ventaja a la casa?",["El crupier se planta con 17 blando","El crupier pide con 17 blando","Se permite rendirse"],1,"Cuando el crupier pide con 17 blando a veces mejora su mano: la casa gana alrededor de 0,2 % más.")]},{id:"l14",title:"El seguro",sum:["El seguro es una apuesta aparte a que el crupier tiene blackjack; paga 2 a 1.","Sin contar cartas pierde alrededor de 7 %: no lo tomes.","El pago parejo es lo mismo que el seguro: tampoco conviene."],steps:[J("Qué es",["Cuando el crupier muestra un As, te ofrece un **seguro** (*insurance*): apostás la mitad de tu apuesta a que tiene blackjack.","Si lo tiene, el seguro paga **2 a 1**."],{v:"cards",cards:["Ah","X"],caption:"El crupier muestra As"}),...Pe([{bank:100,bet:10,d:["Ah","7s?"],p:["10c","Qd"],say:"Apostaste 10 y tenés 20. El crupier muestra un As y te ofrece el **seguro**: apostar 5 más a que tiene blackjack."},{bank:90,ask:{q:"¿Tomás el seguro?",o:["Sí, para proteger mi 20","No"],a:1,x:"El seguro no protege tu mano: es una apuesta aparte sobre su carta tapada, y sin contar cartas pierde plata."}},{d:["Ah","7s"],meter:!0,say:"El crupier mira su carta: no tiene blackjack. Tiene **18** y se planta."},{stamp:{p:"win"},bank:110,say:"Tu 20 gana. Si hubieras tomado el seguro, además habrías perdido 5."}]),J("Por qué pierde",["Para que el seguro no pierda plata, más de un tercio de las cartas que quedan tendrían que valer 10.","Normalmente son 4 de cada 13 (31 %). Por eso el seguro pierde alrededor de **7 %** a la larga."],{v:"tiles",items:[{v:"33 %",l:"de dieces para empatar",tone:"mid"},{v:"31 %",l:"lo que hay normalmente",tone:"bad"}]}),J("El pago parejo",["Si tenés blackjack y el crupier muestra As, te ofrecen **pago parejo** (even money): cobrar 1 a 1 en el acto.","Es exactamente lo mismo que tomar el seguro, así que tampoco conviene."]),I("¿Cuánto paga el seguro?",["1 a 1","2 a 1","3 a 2"],1,"Paga 2 a 1 si el crupier tiene blackjack."),I("¿Cuándo sí conviene el seguro?",["Nunca","Cuando contás cartas y quedan muchos dieces","Cuando tenés blackjack"],1,"Con el conteo alto quedan suficientes dieces. Lo ves en la sección 4.")]},{id:"l15",title:"Cuándo levantarse",sum:["Las rachas no cambian tus chances: solo importa qué cartas quedan.","Decidí cuánto jugar y cuánto podés perder antes de sentarte.","Ningún sistema de apuestas, como la martingala, le gana a la casa."],steps:[J("Las rachas no existen",['Haber perdido cinco manos seguidas no hace que "te toque ganar".',"Lo único que cambia tus chances es **qué cartas quedan en el zapato**, y eso es justamente lo que mide el conteo."]),J("Tus límites, antes de sentarte",["Decidí cuánto vas a jugar y cuánto podés perder **antes** de llegar.","Jugá solo plata que no necesitás. Apostar más para recuperar es la forma más rápida de perder mucho."]),J("Los sistemas de apuestas",["Duplicar la apuesta después de perder (la martingala) y otras progresiones **no cambian la ventaja**: solo cambian cuándo y cuánto perdés.","El conteo funciona porque mira las cartas, no los resultados anteriores."]),I("Perdiste cinco manos seguidas. ¿La próxima tenés más chances de ganar?",["Sí, ya me toca","No: los resultados anteriores no cambian nada"],1,"Las cartas no se acuerdan de lo que ganaste o perdiste."),I("¿Qué hace la martingala (doblar la apuesta después de perder)?",["Le gana a la casa","No cambia la ventaja y arriesga mucho para ganar poco"],1,"Ganás seguido de a poco, pero cuando llega una racha larga perdés todo junto."),I("¿Cuándo conviene decidir tu límite de pérdida?",["Antes de empezar a jugar","Cuando ya perdí bastante","No hace falta"],0,"En caliente se decide mal. Y si el juego deja de ser entretenimiento, frená y pedí ayuda.")]}]},{id:4,title:"El conteo",desc:"Contá el zapato y quedate con la ventaja",icon:"c",lessons:[{id:"l16",title:"Por qué funciona contar",sum:["Las cartas que salen no vuelven hasta la próxima mezcla.","Si quedan muchas cartas altas, la ventaja pasa a tu lado.","Contar no es memorizar cartas: es llevar un solo número."],steps:[J("Las cartas que salen no vuelven",["En un zapato, las cartas repartidas no vuelven hasta la próxima mezcla.","Si salieron muchas cartas chicas, quedan más cartas altas. Y al revés."]),...Pe([{row:["2c","5d","3h","6s","4c","5h","2d","9s"],say:"Supongamos que en las primeras manos del zapato salen estas 8 cartas: siete chicas y un 9."},{row:["2c","5d","3h","6s","4c","5h","2d","9s"],say:"Esas cartas chicas ya no están. Lo que queda en el zapato tiene **más dieces y ases** que lo normal: ahora el zapato te favorece a vos."}]),J("Las cartas altas te ayudan",["Con muchos 10 y ases salen más blackjacks (que vos cobrás 3 a 2 y el crupier no), tus dobles salen mejor y el crupier se pasa más con 12 a 16, porque **está obligado a pedir**."]),J("Las chicas ayudan a la casa",["Con muchas cartas chicas el crupier llega a 17 sin pasarse y tus dobles fallan.","El conteo te dice cuál de las dos situaciones tenés, sin memorizar ninguna carta."]),I("Salieron muchas cartas chicas. ¿Qué queda en el zapato?",["Más cartas altas","Más cartas chicas","Lo mismo de siempre"],0,"Si las chicas ya salieron, en proporción quedan más altas."),I("¿Por qué un zapato con muchas cartas altas te favorece?",["Porque el crupier está obligado a pedir con 12 a 16 y se pasa más","Porque el crupier juega peor","Porque las cartas altas pagan más"],0,"Y además salen más blackjacks y tus dobles mejoran."),I("¿Contar cartas es memorizar todas las cartas que salieron?",["Sí","No: es llevar un solo número que sube y baja"],1,"Con Hi-Lo llevás un solo número. Lo ves en la próxima lección.")]},{id:"l17",title:"Los valores de las cartas",sum:["Hi-Lo: del 2 al 6 valen +1; 7, 8 y 9 valen 0; dieces, figuras y ases valen −1.","Sumá el valor de cada carta que ves: ese total es el conteo corrido (running count).","Un mazo completo suma 0."],steps:[...Pe([{bank:100,rc:0,left:6,say:"Volvés a la mesa, ahora para contar. El sistema **Hi-Lo** le da a cada carta un valor: **+1, 0 o −1**. Mirá qué pasa cuando salen cartas."},{bet:10,bank:90,d:["5d","Kc?"],p:["3h","6s"],tags:!0,say:"Te tocan un 3 y un 6, y el crupier muestra un 5. Las tres son **bajas (del 2 al 6)**: cada una vale **+1**."},{rc:3,tags:!0,say:"Salieron tres cartas bajas: en el zapato quedan más altas que antes, y eso te conviene. El **conteo corrido** (*running count*) sube a **+3**."},{p:["3h","6s","8c"],tags:!0,say:"Pedís y sale un 8. **El 7, el 8 y el 9 valen 0**: no cambian nada. Seguís en **+3**."},{d:["5d","Kc"],tags:!0,ask:{q:"El crupier da vuelta una K. ¿Cuánto vale?",o:["+1","0","−1"],a:2,x:"Las altas (10, J, Q, K y As) valen −1: quedan menos cartas altas en el zapato."}},{rc:2,d:["5d","Kc","9h"],stamp:{d:"bust",p:"win"},bank:110,tags:!0,say:"La K resta 1: **+2**. El crupier pide y saca un 9, neutro: tiene **24**, se pasó. Terminás la ronda con conteo **+2**."}]),J("Los valores",["Cuando sale una carta baja, quedan más altas: es bueno para vos, **sumá 1**.","Cuando sale una alta, **restá 1**. Las del medio no cambian nada.","Sumá a medida que ves cada carta. Ese total es tu **conteo corrido** (*running count*)."],{v:"values"}),{t:"deal",title:"Miralo en acción",intro:"Estas son las cartas de una ronda. Repartilas de a una y sumá el valor de cada una.",cards:["2s","5h","Kc","6d","9s","3h"],after:["Salieron cuatro cartas bajas y una alta: el zapato que queda tiene más cartas altas de lo normal.","Tu conteo corrido es **+3**. Cuánto pesa eso depende de cuántos mazos quedan: lo ves en la lección 19."]},{t:"tags",title:"Probalo",cards:["5h","Ks","8d","2c","Ah"]},I("¿Cuánto vale un 7 en Hi-Lo?",["+1","0","−1"],1,"El 7, el 8 y el 9 son neutros."),I("¿Cuánto vale un As en Hi-Lo?",["+1","0","−1"],2,"El As es carta alta: −1."),I("Un mazo completo tiene 20 cartas de +1, 12 de 0 y 20 de −1. ¿Cuánto suma?",["0","+20","−20"],0,"Las +1 y las −1 se cancelan: un mazo completo suma 0. Por eso Hi-Lo es un sistema balanceado.")]},{id:"l18",title:"El conteo corrido",sum:["El conteo corrido arranca en 0 al mezclar y sigue hasta la próxima mezcla.","Contá todas las cartas que ves: las tuyas, las de los demás y las del crupier.","Cancelá de a pares: una alta y una baja juntas suman 0."],steps:[...Pe([{bank:100,rc:0,left:6,others:[{name:"Ana",cards:[]}],say:"El conteo corrido arranca en **0** cuando mezclan y sigue mano tras mano hasta la próxima mezcla. Contás **todas** las cartas que ves, también las de los demás."},{bet:10,bank:90,others:[{name:"Ana",cards:["Kh","4c"]}],d:["5h","10c?"],p:["9s","Qd"],tags:!0,say:"Primera ronda: Ana tiene K y 4, vos 9 y Q, y el crupier muestra un 5."},{tags:!0,ask:{q:"¿Cuánto da el conteo hasta acá?",o:["−1","0","+1"],a:1,x:"La K se cancela con el 4, tu Q con el 5 del crupier y el 9 es neutro: 0."}},{tags:!0,say:"Ese es el truco: **cancelar de a pares**. Una alta y una baja juntas suman 0, así que no sumás carta por carta: solo mueven el conteo las que sobran."},{d:["5h","10c"],rc:-1,tags:!0,say:"Ana y vos se plantan. El crupier da vuelta un 10: **−1**."},{d:["5h","10c","7s"],stamp:{d:"bust",p:"win"},bank:110,tags:!0,say:"Pide y saca un 7: **22**, se pasó. El 7 es neutro: el conteo queda en **−1**, y así sigue en la próxima mano."},{reset:!0,bank:100,bet:10,rc:-1,left:6,others:[{name:"Ana",cards:["8d","8h"]}],d:["2c","9h?"],p:["Ad","3s"],tags:!0,say:"Mano nueva, pero el conteo **no vuelve a 0**: arrancás en −1. Ana tiene dos 8, el crupier muestra un 2 y vos, As y 3."},{tags:!0,ask:{q:"¿Cuánto es el conteo corrido ahora?",o:["−1","0","+1"],a:1,x:"Venías en −1. Los 8 son neutros, el 2 y el 3 suman 2 y el As resta 1: −1 + 2 − 1 = 0."}},{rc:0,say:"Conteo **0**. Así se lleva durante todo el zapato: cada carta que ves lo mueve, hasta que mezclan."}]),{t:"deal",title:"Contá conmigo",intro:"Repartí las cartas y mirá cómo se mueve el conteo.",cards:["10h","3c","Ad","5s","7h","Jc","4d","2s"],after:["Terminaste en **+1**. Fijate cómo las altas y las bajas se fueron cancelando."]},{t:"count",title:"Ahora vos",intro:"Mirá las 8 cartas y después decí el conteo.",cards:["6s","Kd","3h","9c","2d","Qs","5c","4h"],ms:1300,options:["+1","+2","+3","+4"],answer:2,explain:"6 (+1), K (−1), 3 (+1), 9 (0), 2 (+1), Q (−1), 5 (+1), 4 (+1): +3."},{t:"count",title:"Otra más",intro:"Esta vez salen muchas altas.",cards:["Ac","10d","8s","Jh","3d","Kc","7s","Qd"],ms:1200,options:["−2","−3","−4","−5"],answer:2,explain:"A (−1), 10 (−1), 8 (0), J (−1), 3 (+1), K (−1), 7 (0), Q (−1): −4."},I("¿El conteo corrido vuelve a 0 en cada mano?",["Sí","No: sigue hasta que mezclan el zapato"],1,"Se lleva durante todo el zapato.")]},{id:"l19",title:"El conteo real",sum:["Conteo real = conteo corrido ÷ mazos que quedan.","Los mazos que quedan se estiman mirando la bandeja de descarte.","En esta app se redondea hacia abajo: +2,7 cuenta como +2."],steps:[...Pe([{rc:6,left:5,say:"Vas jugando y el conteo corrido es **+6**. ¿Es mucho? Depende de cuántas cartas quedan por repartir."},{left:1,say:"Si quedara **un solo mazo**, +6 serían seis cartas altas de más en apenas 52 cartas: muchísimo."},{left:6,say:"Con **6 mazos** por repartir, esas seis altas de más se reparten entre 312 cartas: casi no se notan."},{left:3,say:"Para comparar se usa el **conteo real** (*true count*): el conteo corrido dividido por los **mazos que quedan**."},{ask:{q:"Corrido +6 y quedan 3 mazos. ¿Cuál es el conteo real?",o:["+2","+3","+6"],a:0,x:"+6 ÷ 3 = +2."}},{tc:2,say:"Conteo real **+2**. Es el número que mirás para apostar y para las jugadas que cambian con el conteo."},{rc:9,left: :["7c","Kd?"],p:["Ah","Js"],stamp:{p:"bj"},say:"Conteo real **+4**: apostás **6 unidades**, 60. Te sale blackjack y cobrás 90: con el conteo alto salen más blackjacks, y vos tenés más plata en la mesa."},{reset:!0,rc:-4,left:2,tc:-2,bet:10,say:"Cuando el conteo baja, volvés a **1 unidad**. Corrido −4 con 2 mazos: conteo real −2, apuesta mínima."}]),J("Cuánto vale cada punto",["Ventaja aproximada según el conteo real, con 6 mazos y buenas reglas."],{v:"edge"}),J("Una escala simple",["Tu **unidad** es tu apuesta base. Apostá según el conteo real:"],{v:"ramp"}),J("En la práctica",["Si tu unidad es 10, con conteo real +3 apostás 40.","Saltar de golpe de 1 a 8 unidades llama mucho la atención: en un casino, subí y bajá de a poco."]),I("Conteo real +3 y tu unidad es 10. ¿Cuánto apostás?",["10","20","40","80"],2,"+3 → 4 unidades → 40."),I("Conteo real −2. ¿Cuánto apostás?",["Nada: me levanto","1 unidad, la mínima","2 unidades"],1,"En la mesa, apostá el mínimo. Si podés mirar sin jugar, también podés esperar a que suba (lo ves en la sección 5)."),I("Conteo corrido +10 y quedan 5 mazos. ¿Cuántas unidades?",["1","2","4","8"],1,"+10 ÷ 5 = +2 → 2 unidades.")]},{id:"l21",title:"Cuándo el seguro se vuelve buena apuesta",sum:["Con conteo real +3 o más, el seguro gana plata: tomalo.","Con menos de +3, nunca: tampoco el pago parejo.","Es la desviación que más vale de todo el Illustrious 18."],steps:[J("El seguro y los dieces",["El seguro gana plata si más de un tercio de las cartas que quedan son dieces.","Con el conteo alto quedan muchos dieces. **Con conteo real +3 o más, tomá el seguro.**"]),...Pe([{bank:100,bet:10,tc:4,d:["Ah","Kd?"],p:["9h","8c"],say:"Apostaste 10 y el conteo real es **+4**. El crupier muestra un As."},{bank:90,ask:{q:"¿Tomás el seguro?",o:["Sí","No"],a:0,x:"Con conteo real +3 o más quedan suficientes dieces: el seguro pasa a ganar plata."}},{bank:85,say:"Ponés 5 de seguro, la mitad de tu apuesta."},{d:["Ah","Kd"],stamp:{d:"bj",p:"lose"},bank:100,say:"Tenía bla
