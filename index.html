ana y cobrás 20: el doble que sin doblar."}]),P("Los dobles duros",["**11:** doblá contra todo, menos contra As (en mesas H17, también contra As).","**10:** doblá contra 2 a 9.","**9:** doblá contra 3 a 6."],{v:"chart",tab:"hard",rows:[11,10,9]}),P("Los dobles blandos",["Contra **5 y 6**: doblá de A,2 a A,7.","Contra **4**: de A,4 a A,7.","Contra **3**: A,6 y A,7.","Contra **2**: ninguna (en mesas H17, A,7)."],{v:"chart",tab:"soft",rows:[18,17,16,15,14,13]}),Me("10",["6c","4s"],"H","Pedí 10 contra 10: el crupier tiene una carta tan buena como la tuya."),Me("2",["5h","4c"],"H","Pedí 9 contra 2: el 9 solo se dobla contra 3 a 6."),Me("4",["Ad","4c"],"D","Doblá A,4 contra 4."),Me("4",["As","2h"],"H","Pedí A,2 contra 4: A,2 y A,3 se doblan solo contra 5 y 6."),Me("A",["7d","4s"],"H","Pedí 11 contra As (en mesas S17)."),W("Pediste con 5,4 y te salió un 2: tenés 11 con tres cartas contra un 6. ¿Podés doblar?",["Sí","No: solo se dobla con las dos primeras cartas"],1,"Con tres cartas ya no se puede doblar: pedí.")]},{id:"l11",title:"Separar ases y ochos",sum:["Separar es dividir un par en dos manos, poniendo otra apuesta igual.","Separá siempre los ases y los ochos.","Después de separar, As + 10 es 21 común, no blackjack."],steps:[P("Separar",["Con dos cartas iguales podés **separarlas** (en inglés, *split*): ponés otra apuesta igual a la primera y cada carta arranca una mano nueva."],{v:"cards",cards:["8h","8c"],caption:"Un par de 8"}),...Ye([{bank:100,bet:10,d:["10s","7d?"],p:["8h","8c"],say:"Apostaste 10 y tenés un par de 8 contra un 10. Juntos son **16**, la peor mano del juego."},{bank:90,act:"P",say:"Separalos: tocá **Separar**."},{hands:[["8h"],["8c"]],bank:80,say:"Ponés otra apuesta de 10 y cada 8 arranca su propia mano."},{hands:[["8h","3d"],["8c","Kc"]],say:"Llega una carta a cada una: **11** y **18**. Dos manos mucho mejores que un 16."},{say:"Desde ahí, cada mano se juega por separado, como cualquier otra. Separando los 8 contra un 10 perdés menos que jugando el ,"Dos cartas iguales: primero mirás la tabla de pares."),W("Tenés A, 5 y 10. ¿En qué tabla lo buscás?",["Duras","Blandas","Pares"],0,"Si el As valiera 11 te pasarías: vale 1 y tenés 16 duro.",{cards:["Ah","5c","Ts"]}),P("Las duras, en palabras",["Así se dice la tabla de duras con las reglas de tu mesa. Leela de arriba abajo: es más fácil de lo que parece."],{v:"chartWords",tab:"hard"}),P("Las blandas, en palabras",["Con las blandas casi nunca te plantás antes de 18, porque no te podés pasar con una carta."],{v:"chartWords",tab:"soft"}),P("Los pares, en palabras",["Ases y ochos: siempre. Dieces y cincos: nunca. El resto depende de la carta del crupier."],{v:"chartWords",tab:"pairs"}),Me("10",["Ts","6h"],"H","Pedí: 13 a 16 se plantan solo contra 2 a 6."),Me("4",["Th","2c"],"S","Plantate: con 12, plantate contra 4, 5 y 6."),Me("6",["Ah","7d"],"D","Doblá: A,7 contra 3 a 6 se dobla."),Me("A",["8h","8s"],"P","Separá: ases y ochos, siempre."),Me("5",["9s","2d"],"D","Doblá: 11 se dobla casi siempre."),Me("9",["Ad","7c"],"H","Pedí: A,7 contra 9, 10 o As es una mano floja."),P("Tu tabla, siempre a mano",["En **Aprender**, tocá el botón de la tabla (arriba a la derecha) para verla cuando quieras.","Cada casilla te dice por qué se juega así y cómo te va con esa mano en Entrenar: un punto verde si la dominás y uno rojo si te cuesta."])]}]},{id:3,title:"Plata, ventajas y trampas",desc:"Las trampas que te cuestan plata antes de que salga una carta",icon:"d",lessons:[{id:"l13",title:"Mesas 3:2 y 6:5",sum:["Fijate en el cartel: el blackjack tiene que pagar 3:2.","Una mesa 6:5 le suma a la casa alrededor de 1,4 %.","Que el crupier pida con 17 blando o no poder doblar después de separar también te cuesta."],steps:[P("El cartelito que importa",["En la mesa vas a ver cuánto paga el blackjack: **3 a 2** o **6 a 5**.","Parece un detalle, pero es la regla que más plata te cuesta."],{v:"payout"}),...Ye([{bank:100,bet:10,d:["9h","7s?"],p:["As","Kh"],stamp:{p:"bj"},say:"Apostaste 10 y te sali
