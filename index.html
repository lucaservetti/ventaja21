  }), { threshold: 0.35 });
  document.querySelectorAll("[data-vid]").forEach((v) => { if (still) v.controls = true; vo.observe(v); });

  // ---- Mini juego: manos de la estrategia básica (6 mazos, el crupier se planta con 17 blando) ----
  const HANDS = [
    { d: "10", p: ["10", "6"], a: "H", es: "Con 16 contra un 10 perdés seguido igual, pero plantarte pierde más: el crupier llega a 17 o más muy seguido.", en: "16 against a 10 loses often either way, but standing loses more: the dealer reaches 17+ very often." },
    { d: "4", p: ["10", "2"], a: "S", es: "Contra un 4 el crupier se pasa mucho. Con 12 no te arriesgues: dejá que pida él.", en: "Against a 4 the dealer busts a lot. With 12 don't risk it: let them draw." },
    { d: "6", p: ["5", "6"], a: "D", es: "11 contra un 6 es la mejor mano para doblar: hay muchas cartas de 10 y el 6 es la peor carta del crupier.", en: "11 against a 6 is the best double: lots of 10s and the 6 is the dealer's worst card." },
    { d: "9", p: ["A", "7"], a: "H", es: "El 18 blando no alcanza contra un 9: el crupier suele llegar a 19. Pedí, que no te podés pasar.", en: "Soft 18 isn't enough against a 9: the dealer often makes 19. Hit, you can't bust." },
    { d: "5", p: ["A", "7"], a: "D", es: "Contra un 5 el crupier está débil: doblá el 18 blando para ganar más cuando se pase.", en: "Against a 5 the dealer is weak: double soft 18 to win more when they bust." },
    { d: "9", p: ["6", "4"], a: "D", es: "Con 10 contra un 9 doblás: tenés más chances que el crupier de llegar a una mano alta.", en: "With 10 against a 9 you double: you're more likely than the dealer to end up with a strong hand." },
    { d: "2", p: ["7", "5"], a: "H", es: "12 contra un 2 es la excepción: el 2 no es tan débil, así que pedís una carta.", en: "12 against a 2 is the exception: the 2 isn't that weak, so you hit." },
    { d: "2", p: ["9", "4"], a: "S", es: "Con 13 o más contra un 2 al 6 te plantás: que se arriesgue el crupier.", en: "With 13 or more against a 2 through 6 you stand: let the dealer take the risk." },
    { d: "7", p: ["A", "6"], a: "H", es: "17 blando nunca se planta: pedís sin miedo, ninguna carta te pasa.", en: "Never stand on soft 17: hit without fear, no card can bust you." },
    { d: "10", p: ["10", "7"], a: "S", es: "Con 17 duro siempre te plantás, incluso contra un 10.", en: "Always stand on hard 17, even against a 10." },
    { d: "3", p: ["5", "4"], a: "D", es: "9 contra un 3 al 6: doblás, porque el crupier está débil.", en: "9 against a 3 through 6: double, the dealer is weak." },
    { d: "7", p: ["9", "6"], a: "H", es: "15 contra un 7: el crupier tiene buena carta, así que pedís aunque te puedas pasar.", en: "15 against a 7: the dealer has a good card, so you hit even though you might bust." },
  ];
  const SUITS = ["s", "h", "d", "c"];
  // Palos dibujados (las fuentes del sistema dibujan ♠♥♦♣ cada una a su manera y quedaban torcidos).
  const PIP = {
    s: "M12 2s-8.5 6.2-8.5 11.2c0 2.8 2.1 4.6 4.5 4.6 1.4 0 2.6-.6 3.2-1.5-.3 2.2-1.2 3.9-2.7 5.2h7c-1.5-1.3-2.4-3-2.7-5.2.6.9 1.8 1.5 3.2 1.5 2.4 0 4.5-1.8 4.5-4.6C20.5 8.2 12 2 12 2z",
    h: "M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.2 0 3.7 1.2 5.3 3.2 1.6-2 3.1-3.2 5.3-3.2 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z",
    d: "M12 2l8 10-8 10-8-10z",
    c: "M12 2.5a4.2 4.2 0 0 0-3.9 5.8 4.2 4.2 0 1 0 2.5 7.7c-.3 2-1.2 3.6-2.6 4.9h8c-1.4-1.3-2.3-2.9-2.6-4.9a4.2 4.2 0 1 0 2.5-7.7A4.2 4.2 0 0 0 12 2.5z",
  };
  const pip = (s) => `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${PIP[s]}"/></svg>`;
  const VAL = (r) => (r === "A" ? 11 : Number(r));
  let qOrder = HANDS.map((_, i) => i).sort(() => Math.random() - 0.5);
  let qi = 0, qOk = 0, qN = 0, qDone = false;
  const cardEl = (r, k) => { const s = SUITS[(k + r.length + qi) % 4]; const ix = `${r}${pip(s)}`; return `<div class="qz-card${s === "h" || s === "d" ? " red" : ""}" style="animation-delay:${k * 0.08}s" role="img" aria-label="${r}"><span class="qz-ix">${ix}</span><span class="qz-pip">${pip(s)}</span><span class="qz-ix br">${ix}</span></div>`; };
  function total(p) { let t = p.reduce((a, r) => a + VAL(r), 0); const soft = p.includes("A") && t <= 21; if (t > 21 && p.includes("A")) t -= 10; return (soft ? (lang === "en" ? "Soft " : "Blando ") : "") + t; }
  function deal() {
    const h = HANDS[qOrder[qi % qOrder.length]];
    qDone = false;
    document.getElementById("qz-dealer").innerHTML = cardEl(h.d, 0) + '<div class="qz-card back"></div>';
    document.getElementById("qz-you").innerHTML = h.p.map((r, k) => cardEl(r, k + 1)).join("");
    document.getElementById("qz-total").textContent = total(h.p);
    document.getElementById("qz-fb").innerHTML = "";
    document.getElementById("qz-next").hidden = true;
    document.querySelectorAll(".qz-acts button").forEach((b) => { b.disabled = false; b.className = ""; });
  }
  function answer(a) {
    if (qDone) return;
    qDone = true;
    const h = HANDS[qOrder[qi % qOrder.length]];
    const t = T[lang];
    const ok = a === h.a;
    qN++; if (ok) qOk++;
    document.querySelectorAll(".qz-acts button").forEach((b) => { b.disabled = true; if (b.dataset.a === h.a) b.className = "ok"; else if (b.dataset.a === a) b.className = "bad"; });
    const name = t["qz-" + h.a.toLowerCase()];
    document.getElementById("qz-fb").innerHTML = `<b class="${ok ? "ok" : "bad"}">${ok ? t["qz-ok"] : t["qz-bad"].replace("{0}", name.toLowerCase())}</b><p>${h[lang]}</p>${qN >= 3 ? `<p><a href="app/">${t["qz-more"]}</a></p>` : ""}`;
    document.getElementById("qz-score").textContent = t["qz-score"].replace("{0}", qOk).replace("{1}", qN);
    document.getElementById("qz-next").hidden = false;
  }
  document.querySelectorAll(".qz-acts button").forEach((b) => b.addEventListener("click", () => answer(b.dataset.a)));
  document.getElementById("qz-again").addEventListener("click", () => { qi++; deal(); });
  deal();

  // ---- Botón fijo en el celular: aparece cuando ya no se ve el de arriba ----
  const dock = document.getElementById("dock");
  let heroOut = false, endIn = false;
  const showDock = () => { const on = heroOut && !endIn; dock.classList.toggle("on", on); dock.setAttribute("aria-hidden", on ? "false" : "true"); dock.querySelector("a").tabIndex = on ? 0 : -1; };
  new IntersectionObserver(([e]) => { heroOut = !e.isIntersecting; showDock(); }).observe(document.querySelector(".hero .ctas"));
  new IntersectionObserver(([e]) => { endIn = e.isIntersecting; showDock(); }).observe(document.querySelector(".final"));
  const bar = document.getElementById("bar");
  addEventListener("scroll", () => bar.classList.toggle("scrolled", scrollY > 8), { passive: true });
</script>
</body>
</html>
