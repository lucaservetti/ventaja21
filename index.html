 arranca en 11 y cualquier carta de 10 te deja en 21.","**Separá los ases siempre.** En casi todos los casinos recibís una sola carta por As, y A + 10 después de separar es 21, no blackjack."]),P("Los ochos: siempre",["8,8 es 16, la peor mano del juego. Separados, cada 8 arranca una mano mucho mejor.","Incluso contra 10 o As: separando perdés menos que jugando el 16. Única excepción: en mesas H17 con rendición, contra As conviene rendirse."]),Me("10",["8d","8s"],"P","Separá: dos manos que arrancan en 8 pierden menos que un 16."),Me("6",["Ah","Ad"],"P","Separá siempre los ases."),Me("A",["8c","8h"],"P","Separá (en mesas S17; con H17 y rendición, rendite)."),W("Separaste ases y en uno te salió una K. ¿Tenés blackjack?",["Sí, cobro 3 a 2","No: es 21 y se paga 1 a 1"],1,"Después de separar, A + 10 cuenta como 21 común.")]},{id:"l12",title:"Pares que nunca se separan",sum:["Nunca separes los dieces: 20 gana casi siempre.","Nunca separes los cincos: jugalos como un 10.","9,9 se separa contra 2 a 9, menos contra 7; el 4,4 solo contra 5 y 6."],steps:[...Ge([{bank:100,bet:10,d:["6d","9c?"],p:["Kh","Ks"],say:"Apostaste 10 y tenés dos K contra un 6. Es tentador separar contra un crupier débil…"},{bank:90,act:"S",say:"…pero 20 ya es una mano ganadora. Nunca separes los dieces: tocá **Plantarse**."},{d:["6d","9c"],meter:!0,say:"El crupier da vuelta un 9: tiene 15 y pide."},{d:["6d","9c","Jh"],stamp:{d:"bust",p:"win"},bank:110,say:"Una J: **25**, se pasó. Tu 20 cobra."}]),P("Nunca separes los dieces",["10,10 es 20: gana casi siempre.","Separarlos es cambiar una mano ganadora por dos manos que arrancan en 10."]),P("Nunca separes los cincos",["5,5 es 10, una gran mano para doblar.","Jugala como un 10: doblá contra 2 a 9 y pedí contra 10 y As."]),P("El resto de los pares",["**9,9:** separá contra 2 a 9, menos contra 7 (plantate: tu 18 le gana a su 17 probable). Contra 10 y As, plantate.","**7,7:** separá contra 2 a 7. **6,6:** contra 2 a 6. **2,2 y 3,3:** contra 2 a 7. **4,4:** solo contra 5 y 6.","Si la mesa **no deja doblar después de separar**: el 6,6 se separa contra 3 a 6, el 2,2 y el 3,3 contra 4 a 7, y el 4,4 nunca."],{v:"chart",tab:"pairs"}),Me("8",["5c","5d"],"D","Doblá: 5,5 se juega como un 10."),Me("7",["9h","9c"],"S","Plantate: 18 le gana al 17 probable del crupier."),Me("9",["9s","9d"],"P","Separá: contra 9 dos manos de 9 rinden más que un 18."),Me("3",["4h","4s"],"H","Pedí: el 4,4 solo se separa contra 5 y 6."),Me("7",["7c","7h"],"P","Separá los 7 contra 7.")]},{id:"lt",title:"La tabla completa",sum:["La tabla junta todo: tu mano en las filas, la carta del crupier en las columnas.","H pedir, S plantarse, D doblar, P separar: las letras que vas a ver en todo el mundo.","Primero fijate si tenés un par, después si es blanda; si no, es dura."],steps:[P("Todo en una tabla",["Ya sabés jugar cada tipo de mano. La **tabla de estrategia básica** (*basic strategy*) las junta todas: en cada casilla está la jugada que más plata te deja, o la que menos te hace perder.","Las letras son las que se usan en todo el mundo: **H** pedir (*hit*), **S** plantarse (*stand*), **D** doblar (*double*) y **P** separar (*split*)."],{v:"chart",tab:"hard"}),P("Cómo se lee",["Buscá **tu mano** en la columna de la izquierda y la **carta visible del crupier** arriba. Donde se cruzan está la jugada.","Acá: tenés **16** y el crupier muestra un **10**. La casilla marcada dice **H**: pedí."],{v:"chart",tab:"hard",rows:[17,16,15,14,13,12],hl:[16,8]}),P("Tres tablas",["**Pares**: tus dos primeras cartas son iguales. Es lo primero que mirás, porque ahí aparece la opción de separar.","**Blandas** (*soft*): tenés un As que vale 11.","**Duras** (*hard*): todo lo demás, incluso si tenés un As que ya vale 1."]),W("Tenés A,7. ¿En qué tabla lo buscás?",["Duras","Blandas","Pares"],1,"El As vale 11, así que es un 18 blando."),W("Tenés 8,8. ¿En qué tabla lo buscás?",["Duras","Blandas","Pares"],2,"Dos cartas iguales: primero mirás la tabla de pares."),W("Tenés A, 5 y 10. ¿En qué ás 15: quedás con 115."},{say:"En una mesa **6:5**, el mismo blackjack paga 12: te quedarían 112. Parece poco, pero te sale un blackjack más o menos una vez cada 21 manos, toda la noche."}]),P("Cuánto cuesta",["Cobrar 6:5 en vez de 3:2 le suma a la casa alrededor de **1,4 %**: casi el triple de toda la ventaja que tiene contra la estrategia básica."]),P("Otras reglas que importan",["**A tu favor:** que el crupier se plante con 17 blando, doblar después de separar, la rendición y el corte del zapato bien atrás.","**En contra:** pagar 6:5, que el crupier pida con 17 blando y no poder doblar después de separar."]),W("Apostás 10 en una mesa 6:5 y sacás blackjack. ¿Cuánto ganás?",["15","12","10"],1,"6 a 5: por cada 5 cobrás 6. Con 10, 12."),W("Hay una mesa 3:2 con mínimo 25 y una 6:5 con mínimo 10. Vas a apostar 25 por mano. ¿Cuál conviene?",["La 6:5, es más barata","La 3:2"],1,"Si vas a apostar lo mismo, la 3:2 te cuesta mucho menos a la larga."),W("¿Qué regla le suma ventaja a la casa?",["El crupier se planta con 17 blando","El crupier pide con 17 blando","Se permite rendirse"],1,"Cuando el crupier pide con 17 blando a veces mejora su mano: la casa gana alrededor de 0,2 % más.")]},{id:"l14",title:"El seguro",sum:["El seguro es una apuesta aparte a que el crupier tiene blackjack; paga 2 a 1.","Sin contar cartas pierde alrededor de 7 %: no lo tomes.","El pago parejo es lo mismo que el seguro: tampoco conviene."],steps:[P("Qué es",["Cuando el crupier muestra un As, te ofrece un **seguro** (*insurance*): apostás la mitad de tu apuesta a que tiene blackjack.","Si lo tiene, el seguro paga **2 a 1**."],{v:"cards",cards:["Ah","X"],caption:"El crupier muestra As"}),...Ge([{bank:100,bet:10,d:["Ah","7s?"],p:["10c","Qd"],say:"Apostaste 10 y tenés 20. El crupier muestra un As y te ofrece el **seguro**: apostar 5 más a que tiene blackjack."},{bank:90,ask:{q:"¿Tomás el seguro?",o:["Sí, para proteger mi 20","No"],a:1,x:"El seguro no protege tu mano: es una apuesta aparte sobre su carta tapada, y sin contar cartas pierde plata."}},{d:["Ah","7s"],meter:!0,say:"El crupier mira su carta: no tiene blackjack. Tiene **18** y se planta."},{stamp:{p:"win"},bank:110,say:"Tu 20 gana. Si hubieras tomado el seguro, además habrías perdido 5."}]),P("Por qué pierde",["Para que el seguro no pierda plata, más de un tercio de las cartas que quedan tendrían que valer 10.","Normalmente son 4 de cada 13 (31 %). Por eso el seguro pierde alrededor de **7 %** a la larga."],{v:"tiles",items:[{v:"33 %",l:"de dieces para empatar",tone:"mid"},{v:"31 %",l:"lo que hay normalmente",tone:"bad"}]}),P("El pago parejo",["Si tenés blackjack y el crupier muestra As, te ofrecen **pago parejo** (even money): cobrar 1 a 1 en el acto.","Es exactamente lo mismo que tomar el seguro, así que tampoco conviene."]),W("¿Cuánto paga el seguro?",["1 a 1","2 a 1","3 a 2"],1,"Paga 2 a 1 si el crupier tiene blackjack."),W("¿Cuándo sí conviene el seguro?",["Nunca","Cuando contás cartas y quedan muchos dieces","Cuando tenés blackjack"],1,"Con el conteo alto quedan suficientes dieces. Lo ves en la sección 4.")]},{id:"l15",title:"Cuándo levantarse",sum:["Las rachas no cambian tus chances: solo importa qué cartas quedan.","Decidí cuánto jugar y cuánto podés perder antes de sentarte.","Ningún sistema de apuestas, como la martingala, le gana a la casa."],steps:[P("Las rachas no existen",['Haber perdido cinco manos seguidas no hace que "te toque ganar".',"Lo único que cambia tus chances es **qué cartas quedan en el zapato**, y eso es justamente lo que mide el conteo."]),P("Tus límites, antes de sentarte",["Decidí cuánto vas a jugar y cuánto podés perder **antes** de llegar.","Jugá solo plata que no necesitás. Apostar más para recuperar es la forma más rápida de perder mucho."]),P("Los sistemas de apuestas",["Duplicar la apuesta después de perder (la martingala) y otras progresiones **no cambian la ventaja**: solo cambian cuándo y cuánto perdés.","El conteo funciona porque mira las cartas, no los resultados anteriores."]),W("Perdiste cinco manos seguidas. ¿La próxima tenés más chances de ganar?",["Sí, ya me toca","No: los resultados anteriores no cambian nada"],1,"Las cartas no se acuerdan de lo que ganaste o perdiste."),W("¿Qué hace la martingala (doblar la apuesta después de perder)?",["Le gana a la casa","No cambia la ventaja y arriesga mucho para ganar poco"],1,"Ganás seguido de a poco, pero cuando llega una racha larga perdés todo junto."),W("¿Cuándo conviene decidir tu límite de pérdida?",["Antes de empezar a jugar","Cuando ya perdí bastante","No hace falta"],0,"En caliente se decide mal. Y si el juego deja de ser entretenimiento, frená y pedí ayuda.")]}]},{id:4,title:"El conteo",desc:"Contá el zapato y quedate con la ventaja",icon:"c",lessons:[{id:"l16",title:"Por qué funciona contar",sum:["Las cartas que salen no vuelven hasta la próxima mezcla.","Si quedan muchas cartas altas, la ventaja pasa a tu lado.","Contar no es memorizar cartas: es llevar un solo número."],steps:[P("Las cartas que salen no vuelven",["En un zapato, las cartas repartidas no vuelven hasta la próxima mezcla.","Si salieron muchas cartas chicas, quedan más cartas altas. Y al revés."]),...Ge([{row:["2c","5d","3h","6s","4c","5h","2d","9s"],say:"Supongamos que en las primeras manos del zapato salen estas 8 cartas: siete chicas y un 9."},{row:["2c","5d","3h","6s","4c","5h","2d","9s"],say:"Esas cartas chicas ya no están. Lo que queda en el zapato tiene **más dieces y ases** que lo normal: ahora el zapato te favorece a vos."}]),P("Las cartas altas te ayudan",["Con muchos 10 y ases salen más blackjacks (que vos cobrás 3 a 2 y el crupier no), tus dobles salen mejor y el crupier se pasa más con 12 a 16, porque **está obligado a pedir**."]),P("Las chicas ayudan a la casa",["Con muchas cartas chicas el crupier llega a 17 sin pasarse y tus dobles fallan.","El conteo te dice cuál de las dos situaciones tenés, sin memorizar ninguna carta."]),W("Salieron muchas cartas chicas. ¿Qué queda en el zapato?",["Má
