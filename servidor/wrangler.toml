# Servidor de Edge 21 en Cloudflare Workers (plan gratis). Se publica solo desde GitHub
# (.github/workflows/servidor.yml). Ver servidor/README.md.
name = "edge21-api"
main = "index.js"
compatibility_date = "2026-10-01"
workers_dev = true

# api.edge21.app apunta a este servidor (Cloudflare crea el registro DNS solo).
routes = [{ pattern = "api.edge21.app", custom_domain = true }]

# Limpieza diaria de puntajes viejos y errores vencidos (ver limpiar() en index.js).
[triggers]
crons = ["23 7 * * *"]

# Límites de uso (ver dentroDelLimite en index.js): pedidos por minuto por cuenta y por conexión.
[[ratelimits]]
name = "LIMITE_CUENTA"
namespace_id = "2101"
simple = { limit = 6, period = 60 }

[[ratelimits]]
name = "LIMITE_IP"
namespace_id = "2102"
simple = { limit = 10, period = 60 }

[vars]
PROJECT_ID = "edge21-fb71e"
# Premio de bienvenida (3 días por entrar con Google): "1" cuando la app esté en Google Play.
BIENVENIDA = "0"
# Pagos en la web (Paddle): el código del precio "Para siempre" (pri_…). Ver PAGOS_WEB.md.
PADDLE_PRECIO_SIEMPRE = ""

# Secreto (no va acá): FIREBASE_SA = la clave JSON de la cuenta de servicio de Firebase.
# Secreto (opcional): PADDLE_WEBHOOK_SECRET = el secreto de los avisos de Paddle (pdl_ntfset_…).
